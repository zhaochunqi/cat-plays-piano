<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4a460"/>
      <stop offset="100%" style="stop-color:#e08a30"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bg)"/>

  <!-- Floor -->
  <ellipse cx="300" cy="470" rx="250" ry="20" fill="#0a0a15" opacity="0.5"/>

  <!-- ===== PIANO ===== -->
  <!-- Piano body -->
  <rect x="80" y="260" width="440" height="200" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <!-- Piano top panel -->
  <rect x="70" y="248" width="460" height="18" rx="4" fill="#222" stroke="#333" stroke-width="1"/>
  <!-- Piano keyboard area -->
  <rect x="90" y="310" width="420" height="60" rx="3" fill="#2a2a2a"/>

  <!-- White keys -->
  <rect x="100" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="130" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="160" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="190" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="220" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="250" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="280" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="310" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="340" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="370" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="400" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="430" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="460" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="490" y="315" width="28" height="50" rx="2" fill="#f5f5f0" stroke="#ccc" stroke-width="0.5"/>

  <!-- Black keys -->
  <rect x="115" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="145" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="205" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="235" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="265" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="325" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="355" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="415" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="445" y="315" width="16" height="32" rx="2" fill="#111"/>
  <rect x="475" y="315" width="16" height="32" rx="2" fill="#111"/>

  <!-- Piano lid (open) -->
  <path d="M 80 260 L 60 140 L 200 140 L 180 248 Z" fill="#2a1a0a" stroke="#4a3020" stroke-width="2"/>
  <path d="M 520 260 L 540 140 L 400 140 L 420 248 Z" fill="#2a1a0a" stroke="#4a3020" stroke-width="2"/>
  <!-- Inner lid -->
  <path d="M 80 260 L 65 155 L 190 155 L 175 248 Z" fill="#3a2510"/>
  <path d="M 520 260 L 535 155 L 410 155 L 425 248 Z" fill="#3a2510"/>

  <!-- Piano legs -->
  <rect x="100" y="458" width="16" height="30" rx="2" fill="#1a1a1a"/>
  <rect x="484" y="458" width="16" height="30" rx="2" fill="#1a1a1a"/>

  <!-- ===== CAT ===== -->
  <!-- Tail -->
  <path d="M 480 350 Q 540 320 530 260 Q 525 230 510 240" stroke="#e08a30" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 480 350 Q 540 320 530 260 Q 525 230 510 240" stroke="#f4a460" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Back legs -->
  <ellipse cx="470" cy="380" rx="22" ry="30" fill="url(#bodyGrad)"/>
  <ellipse cx="510" cy="385" rx="20" ry="26" fill="url(#bodyGrad)"/>

  <!-- Body -->
  <ellipse cx="420" cy="340" rx="75" ry="55" fill="url(#bodyGrad)"/>
  <!-- Body stripes -->
  <path d="M 380 300 Q 400 290 420 300" stroke="#d4862a" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 375 320 Q 400 310 425 320" stroke="#d4862a" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 378 340 Q 400 330 422 340" stroke="#d4862a" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Front paws on keys -->
  <ellipse cx="240" cy="310" rx="20" ry="12" fill="#f4a460" transform="rotate(-15, 240, 310)"/>
  <ellipse cx="320" cy="308" rx="20" ry="12" fill="#f4a460" transform="rotate(10, 320, 308)"/>
  <!-- Paw pads -->
  <ellipse cx="232" cy="314" rx="6" ry="4" fill="#ffb6c1" opacity="0.7"/>
  <ellipse cx="328" cy="312" rx="6" ry="4" fill="#ffb6c1" opacity="0.7"/>

  <!-- Head -->
  <ellipse cx="370" cy="250" rx="52" ry="46" fill="url(#bodyGrad)"/>

  <!-- Left ear -->
  <path d="M 330 215 L 315 170 L 348 205 Z" fill="#f4a460" stroke="#e08a30" stroke-width="1"/>
  <path d="M 332 212 L 320 178 L 345 207 Z" fill="#ffb6c1" opacity="0.5"/>

  <!-- Right ear -->
  <path d="M 400 210 L 420 168 L 418 212 Z" fill="#f4a460" stroke="#e08a30" stroke-width="1"/>
  <path d="M 404 210 L 417 178 L 414 212 Z" fill="#ffb6c1" opacity="0.5"/>

  <!-- Face -->
  <!-- Eyes -->
  <ellipse cx="350" cy="245" rx="9" ry="10" fill="#2d5a2d"/>
  <ellipse cx="350" cy="245" rx="5" ry="7" fill="#111"/>
  <ellipse cx="350" cy="243" rx="2" ry="2" fill="#fff" opacity="0.8"/>

  <ellipse cx="388" cy="243" rx="9" ry="10" fill="#2d5a2d"/>
  <ellipse cx="388" cy="243" rx="5" ry="7" fill="#111"/>
  <ellipse cx="388" cy="241" rx="2" ry="2" fill="#fff" opacity="0.8"/>

  <!-- Nose -->
  <path d="M 367 258 L 372 265 L 377 258 Z" fill="#ffb6c1" stroke="#ff9aa2" stroke-width="0.5"/>

  <!-- Mouth -->
  <path d="M 372 265 Q 368 272 362 270" stroke="#c07040" stroke-width="1.5" fill="none"/>
  <path d="M 372 265 Q 376 272 382 270" stroke="#c07040" stroke-width="1.5" fill="none"/>

  <!-- Whiskers -->
  <line x1="320" y1="255" x2="345" y2="258" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="318" y1="263" x2="345" y2="264" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="271" x2="345" y2="270" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="395" y1="258" x2="420" y2="255" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="395" y1="264" x2="422" y2="263" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="395" y1="270" x2="420" y2="271" stroke="#fff" stroke-width="1" opacity="0.6"/>

  <!-- Forehead stripes -->
  <path d="M 365 210 L 368 225" stroke="#d4862a" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 375 208 L 376 225" stroke="#d4862a" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 385 210 L 383 225" stroke="#d4862a" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Musical notes floating -->
  <g opacity="0.7">
    <text x="130" y="180" font-family="serif" font-size="30" fill="#ffd700">♪</text>
    <text x="170" y="150" font-family="serif" font-size="24" fill="#ffd700">♫</text>
    <text x="100" y="140" font-family="serif" font-size="20" fill="#ffd700">♩</text>
    <text x="200" y="120" font-family="serif" font-size="26" fill="#ffd700">♬</text>
    <text x="250" y="160" font-family="serif" font-size="18" fill="#ffd700">♪</text>
    <text x="50" y="200" font-family="serif" font-size="22" fill="#ffd700">♫</text>
  </g>

  <!-- Title -->
  <text x="300" y="495" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#888" letter-spacing="3">THE PIANO CAT</text>
</svg>
