<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#wall)"/>
  <rect y="560" width="900" height="140" fill="url(#floor)"/>

  <!-- Piano body -->
  <rect x="80" y="395" width="740" height="200" rx="12" fill="#1f1f1f" stroke="#000" stroke-width="3"/>
  <!-- top ledge -->
  <rect x="70" y="385" width="760" height="20" rx="6" fill="#2a2a2a"/>

  <!-- Keyboard -->
  <rect x="100" y="360" width="700" height="45" fill="#fafafa" stroke="#000" stroke-width="2"/>
  <!-- white keys -->
  <!-- 14 white keys -->
  <g stroke="#bbb" stroke-width="1">
    <!-- draw vertical separators -->
  </g>
  <!-- We'll draw white key rects -->
  <g fill="#ffffff" stroke="#999" stroke-width="1">
    <rect x="100" y="360" width="50" height="45"/>
    <rect x="150" y="360" width="50" height="45"/>
    <rect x="200" y="360" width="50" height="45"/>
    <rect x="250" y="360" width="50" height="45"/>
    <rect x="300" y="360" width="50" height="45"/>
    <rect x="350" y="360" width="50" height="45"/>
    <rect x="400" y="360" width="50" height="45"/>
    <rect x="450" y="360" width="50" height="45"/>
    <rect x="500" y="360" width="50" height="45"/>
    <rect x="550" y="360" width="50" height="45"/>
    <rect x="600" y="360" width="50" height="45"/>
    <rect x="650" y="360" width="50" height="45"/>
    <rect x="700" y="360" width="50" height="45"/>
    <rect x="750" y="360" width="50" height="45"/>
  </g>
  <!-- black keys -->
  <g fill="#111">
    <rect x="135" y="360" width="30" height="28" rx="3"/>
    <rect x="185" y="360" width="30" height="28" rx="3"/>
    <rect x="285" y="360" width="30" height="28" rx="3"/>
    <rect x="335" y="360" width="30" height="28" rx="3"/>
    <rect x="385" y="360" width="30" height="28" rx="3"/>
    <rect x="485" y="360" width="30" height="28" rx="3"/>
    <rect x="535" y="360" width="30" height="28" rx="3"/>
    <rect x="585" y="360" width="30" height="28" rx="3"/>
    <rect x="635" y="360" width="30" height="28" rx="3"/>
    <rect x="685" y="360" width="30" height="28" rx="3"/>
  </g>

  <!-- Music stand -->
  <rect x="360" y="330" width="180" height="40" fill="#2a2a2a" stroke="#000" stroke-width="2" rx="4"/>
  <rect x="370" y="300" width="160" height="35" fill="#fff" stroke="#000" stroke-width="1" rx="3"/>
  <!-- notes on sheet -->
  <g fill="#000">
    <circle cx="400" cy="318" r="4"/>
    <circle cx="430" cy="312" r="4"/>
    <circle cx="460" cy="320" r="4"/>
    <circle cx="490" cy="310" r="4"/>
  </g>
  <line x1="400" y1="318" x2="400" y2="305" stroke="#000" stroke-width="1.5"/>
  <line x1="430" y1="312" x2="430" y2="299" stroke="#000" stroke-width="1.5"/>

  <!-- Bench -->
  <rect x="330" y="560" width="240" height="18" rx="6" fill="#7c3aed" stroke="#000" stroke-width="2"/>
  <rect x="345" y="578" width="12" height="40" fill="#5b21b6"/>
  <rect x="553" y="578" width="12" height="40" fill="#5b21b6"/>

  <!-- Cat -->
  <!-- tail -->
  <path d="M 560 520 Q 640 470 620 420 Q 600 380 640 360" fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="450" cy="500" rx="95" ry="70" fill="#f97316" stroke="#000" stroke-width="2"/>
  <!-- belly -->
  <ellipse cx="450" cy="515" rx="60" ry="45" fill="#fed7aa"/>
  <!-- head -->
  <circle cx="450" cy="395" r="62" fill="#f97316" stroke="#000" stroke-width="2"/>
  <!-- ears -->
  <polygon points="395,355 415,300 440,350" fill="#f97316" stroke="#000" stroke-width="2"/>
  <polygon points="460,350 485,300 505,355" fill="#f97316" stroke="#000" stroke-width="2"/>
  <polygon points="405,350 418,315 432,348" fill="#fbbf24"/>
  <polygon points="468,348 482,315 495,350" fill="#fbbf24"/>
  <!-- eyes -->
  <ellipse cx="425" cy="390" rx="12" ry="14" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="475" cy="390" rx="12" ry="14" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="428" cy="392" r="6" fill="#16a34a"/>
  <circle cx="478" cy="392" r="6" fill="#16a34a"/>
  <circle cx="430" cy="390" r="2.5" fill="#000"/>
  <circle cx="480" cy="390" r="2.5" fill="#000"/>
  <!-- nose -->
  <polygon points="445,415 455,415 450,422" fill="#ec4899" stroke="#000" stroke-width="1"/>
  <!-- mouth -->
  <path d="M 450 422 Q 435 432 425 425" fill="none" stroke="#000" stroke-width="1.5"/>
  <path d="M 450 422 Q 465 432 475 425" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- whiskers -->
  <g stroke="#000" stroke-width="1">
    <line x1="400" y1="410" x2="360" y2="405"/>
    <line x1="400" y1="420" x2="360" y2="425"/>
    <line x1="500" y1="410" x2="540" y2="405"/>
    <line x1="500" y1="420" x2="540" y2="425"/>
  </g>

  <!-- paws on keys -->
  <ellipse cx="370" cy="360" rx="22" ry="14" fill="#f97316" stroke="#000" stroke-width="2"/>
  <ellipse cx="530" cy="360" rx="22" ry="14" fill="#f97316" stroke="#000" stroke-width="2"/>
  <!-- toes -->
  <g fill="#000">
    <circle cx="355" cy="355" r="3"/>
    <circle cx="370" cy="352" r="3"/>
    <circle cx="385" cy="355" r="3"/>
    <circle cx="515" cy="355" r="3"/>
    <circle cx="530" cy="352" r="3"/>
    <circle cx="545" cy="355" r="3"/>
  </g>
  <!-- arms -->
  <path d="M 390 470 Q 375 420 370 375" fill="none" stroke="#f97316" stroke-width="22" stroke-linecap="round"/>
  <path d="M 510 470 Q 525 420 530 375" fill="none" stroke="#f97316" stroke-width="22" stroke-linecap="round"/>

  <!-- caption -->
  <text x="450" y="670" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="28" fill="#fff" stroke="#000" stroke-width="0.5">Meow-sic! 🎹</text>
</svg>
