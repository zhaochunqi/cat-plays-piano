<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6f0"/>
      <stop offset="100%" stop-color="#d9e9ff"/>
    </linearGradient>
    <linearGradient id="piano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Floor -->
  <rect x="0" y="500" width="800" height="100" fill="#c9a87c"/>
  <rect x="0" y="500" width="800" height="6" fill="#a8845a"/>

  <!-- Piano body -->
  <rect x="80" y="360" width="640" height="160" rx="8" fill="url(#piano)" stroke="#000" stroke-width="2"/>
  <!-- Piano lid top -->
  <rect x="80" y="330" width="640" height="34" rx="6" fill="#2a2a2a" stroke="#000" stroke-width="2"/>
  <!-- Music stand -->
  <rect x="300" y="290" width="200" height="40" fill="#4a4a4a" stroke="#000" stroke-width="1"/>
  <rect x="310" y="298" width="180" height="24" fill="#f5f5dc" stroke="#888" stroke-width="1"/>
  <!-- music notes on stand -->
  <circle cx="340" cy="310" r="5" fill="#000"/>
  <rect x="344" y="298" width="2" height="12" fill="#000"/>
  <circle cx="375" cy="306" r="5" fill="#000"/>
  <rect x="379" y="294" width="2" height="12" fill="#000"/>
  <circle cx="410" cy="312" r="5" fill="#000"/>
  <rect x="414" y="300" width="2" height="12" fill="#000"/>
  <circle cx="445" cy="308" r="5" fill="#000"/>
  <rect x="449" y="296" width="2" height="12" fill="#000"/>

  <!-- Keyboard -->
  <g transform="translate(100,395)">
    <!-- white keys -->
    <rect x="0" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="40" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="80" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="120" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="160" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="200" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="240" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="280" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="320" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="360" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="400" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="440" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="480" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="520" y="0" width="40" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
    <!-- black keys -->
    <rect x="28" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="68" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="148" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="188" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="228" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="308" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="348" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="428" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="468" y="0" width="24" height="70" fill="#000" rx="2"/>
    <rect x="508" y="0" width="24" height="70" fill="#000" rx="2"/>
  </g>

  <!-- Cat -->
  <!-- tail -->
  <path d="M 620 470 Q 700 430 690 360 Q 680 320 660 300" stroke="#f4a261" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 620 470 Q 700 430 690 360 Q 680 320 660 300" stroke="#d9834a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- body -->
  <ellipse cx="560" cy="470" rx="95" ry="60" fill="#f4a261" stroke="#d9834a" stroke-width="2"/>
  <!-- belly -->
  <ellipse cx="560" cy="485" rx="60" ry="35" fill="#fde9d9"/>

  <!-- head -->
  <circle cx="470" cy="395" r="62" fill="#f4a261" stroke="#d9834a" stroke-width="2"/>

  <!-- ears -->
  <polygon points="420,355 435,300 460,345" fill="#f4a261" stroke="#d9834a" stroke-width="2"/>
  <polygon points="500,345 525,300 540,355" fill="#f4a261" stroke="#d9834a" stroke-width="2"/>
  <polygon points="428,350 438,315 452,345" fill="#ffb3c1"/>
  <polygon points="508,345 520,315 532,350" fill="#ffb3c1"/>

  <!-- eyes -->
  <ellipse cx="445" cy="395" rx="10" ry="12" fill="#fff"/>
  <ellipse cx="495" cy="395" rx="10" ry="12" fill="#fff"/>
  <circle cx="447" cy="397" r="6" fill="#2d6a4f"/>
  <circle cx="497" cy="397" r="6" fill="#2d6a4f"/>
  <circle cx="449" cy="394" r="2" fill="#000"/>
  <circle cx="499" cy="394" r="2" fill="#000"/>

  <!-- nose -->
  <polygon points="468,412 472,412 470,416" fill="#e76f51"/>
  <!-- mouth -->
  <path d="M 470 416 Q 460 426 452 420" stroke="#000" stroke-width="1.5" fill="none"/>
  <path d="M 470 416 Q 480 426 488 420" stroke="#000" stroke-width="1.5" fill="none"/>

  <!-- whiskers -->
  <line x1="430" y1="410" x2="395" y2="405" stroke="#000" stroke-width="1"/>
  <line x1="430" y1="416" x2="395" y2="416" stroke="#000" stroke-width="1"/>
  <line x1="430" y1="422" x2="395" y2="427" stroke="#000" stroke-width="1"/>
  <line x1="510" y1="410" x2="545" y2="405" stroke="#000" stroke-width="1"/>
  <line x1="510" y1="416" x2="545" y2="416" stroke="#000" stroke-width="1"/>
  <line x1="510" y1="422" x2="545" y2="427" stroke="#000" stroke-width="1"/>

  <!-- paws on keys -->
  <ellipse cx="400" cy="395" rx="18" ry="12" fill="#f4a261" stroke="#d9834a" stroke-width="1.5" transform="rotate(-20 400 395)"/>
  <ellipse cx="455" cy="398" rx="18" ry="12" fill="#f4a261" stroke="#d9834a" stroke-width="1.5" transform="rotate(-10 455 398)"/>
  <ellipse cx="510" cy="398" rx="18" ry="12" fill="#f4a261" stroke="#d9834a" stroke-width="1.5" transform="rotate(10 510 398)"/>
  <ellipse cx="565" cy="395" rx="18" ry="12" fill="#f4a261" stroke="#d9834a" stroke-width="1.5" transform="rotate(20 565 395)"/>

  <!-- front legs -->
  <rect x="490" y="440" width="22" height="60" rx="10" fill="#f4a261" stroke="#d9834a" stroke-width="1.5"/>
  <rect x="590" y="440" width="22" height="60" rx="10" fill="#f4a261" stroke="#d9834a" stroke-width="1.5"/>

  <!-- floating music notes -->
  <g fill="#6a0dad" font-family="serif" font-size="28">
    <text x="230" y="260">♪</text>
    <text x="560" y="250">♫</text>
    <text x="680" y="290">♪</text>
  </g>
</svg>
