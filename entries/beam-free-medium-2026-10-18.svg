<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e7d7"/>
      <stop offset="100%" stop-color="#e8d3b9"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4a259"/>
      <stop offset="100%" stop-color="#d97d3a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="480" width="800" height="120" fill="#c9a87a"/>

  <!-- piano body -->
  <rect x="120" y="360" width="560" height="180" rx="12" fill="#3b2a1a"/>
  <rect x="120" y="360" width="560" height="24" rx="12" fill="#5a3f28"/>
  <!-- music desk -->
  <rect x="200" y="300" width="400" height="14" rx="4" fill="#5a3f28"/>
  <rect x="200" y="286" width="400" height="16" rx="4" fill="#7a5a3a"/>
  <!-- sheet music -->
  <rect x="260" y="230" width="280" height="60" rx="4" fill="#fffaf0" stroke="#999" stroke-width="1"/>
  <line x1="275" y1="245" x2="525" y2="245" stroke="#333" stroke-width="1"/>
  <line x1="275" y1="255" x2="525" y2="255" stroke="#333" stroke-width="1"/>
  <line x1="275" y1="265" x2="525" y2="265" stroke="#333" stroke-width="1"/>
  <line x1="275" y1="275" x2="525" y2="275" stroke="#333" stroke-width="1"/>
  <line x1="275" y1="285" x2="525" y2="285" stroke="#333" stroke-width="1"/>
  <!-- notes -->
  <ellipse cx="300" cy="248" rx="5" ry="3.5" fill="#222" transform="rotate(-20 300 248)"/>
  <line x1="305" y1="248" x2="305" y2="225" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="360" cy="268" rx="5" ry="3.5" fill="#222" transform="rotate(-20 360 268)"/>
  <line x1="365" y1="268" x2="365" y2="245" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="420" cy="258" rx="5" ry="3.5" fill="#222" transform="rotate(-20 420 258)"/>
  <line x1="425" y1="258" x2="425" y2="235" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="480" cy="278" rx="5" ry="3.5" fill="#222" transform="rotate(-20 480 278)"/>
  <line x1="485" y1="278" x2="485" y2="255" stroke="#222" stroke-width="1.5"/>

  <!-- keyboard -->
  <g transform="translate(140,384)">
    <!-- white keys -->
    <g fill="#fff" stroke="#bbb" stroke-width="1">
      <rect x="0" y="0" width="40" height="130" rx="3"/>
      <rect x="40" y="0" width="40" height="130" rx="3"/>
      <rect x="80" y="0" width="40" height="130" rx="3"/>
      <rect x="120" y="0" width="40" height="130" rx="3"/>
      <rect x="160" y="0" width="40" height="130" rx="3"/>
      <rect x="200" y="0" width="40" height="130" rx="3"/>
      <rect x="240" y="0" width="40" height="130" rx="3"/>
      <rect x="280" y="0" width="40" height="130" rx="3"/>
      <rect x="320" y="0" width="40" height="130" rx="3"/>
      <rect x="360" y="0" width="40" height="130" rx="3"/>
      <rect x="400" y="0" width="40" height="130" rx="3"/>
      <rect x="440" y="0" width="40" height="130" rx="3"/>
      <rect x="480" y="0" width="40" height="130" rx="3"/>
    </g>
    <!-- black keys -->
    <g fill="#1a1a1a">
      <rect x="28" y="0" width="24" height="80" rx="2"/>
      <rect x="68" y="0" width="24" height="80" rx="2"/>
      <rect x="148" y="0" width="24" height="80" rx="2"/>
      <rect x="188" y="0" width="24" height="80" rx="2"/>
      <rect x="228" y="0" width="24" height="80" rx="2"/>
      <rect x="308" y="0" width="24" height="80" rx="2"/>
      <rect x="348" y="0" width="24" height="80" rx="2"/>
      <rect x="428" y="0" width="24" height="80" rx="2"/>
      <rect x="468" y="0" width="24" height="80" rx="2"/>
    </g>
    <!-- pressed keys highlight -->
    <rect x="40" y="0" width="40" height="130" fill="#ffe9a8" opacity="0.6" rx="3"/>
    <rect x="160" y="0" width="40" height="130" fill="#ffe9a8" opacity="0.6" rx="3"/>
  </g>

  <!-- cat body -->
  <g transform="translate(400,300)">
    <!-- tail -->
    <path d="M 40 60 Q 120 20 100 -40 Q 90 -70 60 -60" fill="none" stroke="url(#fur)" stroke-width="22" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="0" cy="40" rx="70" ry="55" fill="url(#fur)"/>
    <!-- head -->
    <circle cx="0" cy="-30" r="55" fill="url(#fur)"/>
    <!-- ears -->
    <polygon points="-45,-70 -25,-105 -10,-70" fill="#f4a259" stroke="#d97d3a" stroke-width="2"/>
    <polygon points="-40,-72 -25,-98 -15,-72" fill="#ffb3c1"/>
    <polygon points="45,-70 25,-105 10,-70" fill="#f4a259" stroke="#d97d3a" stroke-width="2"/>
    <polygon points="40,-72 25,-98 15,-72" fill="#ffb3c1"/>
    <!-- eyes -->
    <ellipse cx="-18" cy="-32" rx="9" ry="11" fill="#fff"/>
    <ellipse cx="18" cy="-32" rx="9" ry="11" fill="#fff"/>
    <circle cx="-16" cy="-30" r="5" fill="#2b7a3d"/>
    <circle cx="20" cy="-30" r="5" fill="#2b7a3d"/>
    <circle cx="-15" cy="-31" r="2" fill="#111"/>
    <circle cx="21" cy="-31" r="2" fill="#111"/>
    <!-- nose -->
    <polygon points="0,-22 -4,-16 4,-16" fill="#ff8fab"/>
    <!-- mouth -->
    <path d="M -4 -16 Q 0 -12 4 -16" fill="none" stroke="#7a3a2a" stroke-width="1.5"/>
    <!-- whiskers -->
    <line x1="-55" y1="-22" x2="-12" y2="-18" stroke="#555" stroke-width="1"/>
    <line x1="-55" y1="-16" x2="-12" y2="-16" stroke="#555" stroke-width="1"/>
    <line x1="-55" y1="-10" x2="-12" y2="-14" stroke="#555" stroke-width="1"/>
    <line x1="55" y1="-22" x2="12" y2="-18" stroke="#555" stroke-width="1"/>
    <line x1="55" y1="-16" x2="12" y2="-16" stroke="#555" stroke-width="1"/>
    <line x1="55" y1="-10" x2="12" y2="-14" stroke="#555" stroke-width="1"/>

    <!-- left arm/paw -->
    <path d="M -55 30 Q -90 60 -70 95" fill="none" stroke="url(#fur)" stroke-width="18" stroke-linecap="round"/>
    <ellipse cx="-68" cy="98" rx="16" ry="12" fill="#f4a259"/>
    <!-- right arm/paw -->
    <path d="M 55 30 Q 90 60 70 95" fill="none" stroke="url(#fur)" stroke-width="18" stroke-linecap="round"/>
    <ellipse cx="72" cy="98" rx="16" ry="12" fill="#f4a259"/>
  </g>

  <!-- floating musical notes -->
  <g fill="#7a3f28" opacity="0.7">
    <text x="120" y="180" font-size="40" font-family="serif">♪</text>
    <text x="640" y="160" font-size="48" font-family="serif">♫</text>
    <text x="60" y="260" font-size="32" font-family="serif">♩</text>
  </g>
</svg>
