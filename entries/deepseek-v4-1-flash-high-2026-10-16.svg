<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A ginger tabby cat sitting on a bench with both paws on the keys of an upright piano">
  <title>Cat playing the piano</title>
  <desc>暖色琴房里的橘色虎斑猫：端坐琴凳，双爪明确落在立式钢琴的白键上。</desc>
  <defs>
    <linearGradient id="c-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d8a8"/>
      <stop offset="1" stop-color="#e2ae72"/>
    </linearGradient>
    <linearGradient id="c-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4643a"/>
      <stop offset="0.5" stop-color="#8c4522"/>
      <stop offset="1" stop-color="#5f2c14"/>
    </linearGradient>
    <linearGradient id="c-wood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5834e"/>
      <stop offset="1" stop-color="#8f4a23"/>
    </linearGradient>
    <linearGradient id="c-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a52"/>
      <stop offset="1" stop-color="#8a5327"/>
    </linearGradient>
    <radialGradient id="c-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 墙面 -->
  <rect width="800" height="600" fill="url(#c-wall)"/>
  <g fill="#c98a52" opacity="0.35">
    <g id="c-dots">
      <circle cx="40" cy="34" r="3"/><circle cx="120" cy="34" r="3"/><circle cx="200" cy="34" r="3"/>
      <circle cx="280" cy="34" r="3"/><circle cx="360" cy="34" r="3"/><circle cx="440" cy="34" r="3"/>
      <circle cx="520" cy="34" r="3"/><circle cx="600" cy="34" r="3"/><circle cx="680" cy="34" r="3"/>
      <circle cx="760" cy="34" r="3"/>
    </g>
    <use href="#c-dots" y="60"/>
    <use href="#c-dots" y="120"/>
    <use href="#c-dots" y="180"/>
    <use href="#c-dots" y="240"/>
  </g>
  <rect y="428" width="800" height="14" fill="#c07a44"/>

  <!-- 地板与地毯 -->
  <rect y="442" width="800" height="158" fill="url(#c-floor)"/>
  <g stroke="#a76a37" stroke-width="2" opacity="0.6">
    <path d="M 0 470 H 800 M 0 500 H 800 M 0 530 H 800 M 0 560 H 800"/>
  </g>
  <ellipse cx="400" cy="520" rx="250" ry="70" fill="#b8813f" opacity="0.55"/>
  <ellipse cx="400" cy="520" rx="250" ry="70" fill="none" stroke="#8f5f2c" stroke-width="6" opacity="0.5"/>
  <ellipse cx="400" cy="520" rx="180" ry="46" fill="#d8a05a" opacity="0.6"/>

  <!-- 墙上的猫肖像画 -->
  <g transform="translate(560,52)">
    <rect width="150" height="118" rx="6" fill="#fdf6e6" stroke="#c9a227" stroke-width="8"/>
    <circle cx="75" cy="52" r="28" fill="#e8873a"/>
    <path d="M 52 40 L 48 16 L 74 34 Z" fill="#e8873a"/>
    <path d="M 98 40 L 102 16 L 76 34 Z" fill="#e8873a"/>
    <circle cx="65" cy="50" r="4" fill="#2b1a0f"/><circle cx="85" cy="50" r="4" fill="#2b1a0f"/>
    <path d="M 70 62 Q 75 68 80 62" stroke="#2b1a0f" stroke-width="3" fill="none"/>
    <path d="M 40 100 Q 75 78 110 100 Z" fill="#e8873a"/>
  </g>

  <!-- 书架与盆栽 -->
  <g transform="translate(24,40)">
    <rect width="180" height="14" rx="4" fill="#8c4522"/>
    <rect y="150" width="180" height="14" rx="4" fill="#8c4522"/>
    <g>
      <rect x="12" y="86" width="22" height="64" fill="#c0392b"/>
      <rect x="36" y="94" width="18" height="56" fill="#2980b9"/>
      <rect x="56" y="80" width="24" height="70" fill="#27ae60"/>
      <rect x="82" y="98" width="16" height="52" fill="#8e44ad"/>
      <rect x="100" y="88" width="22" height="62" fill="#e67e22"/>
      <rect x="124" y="100" width="18" height="50" fill="#16a085"/>
      <rect x="144" y="90" width="20" height="60" fill="#c9a227"/>
    </g>
    <g>
      <rect x="18" y="22" width="20" height="52" fill="#34495e"/>
      <rect x="42" y="32" width="24" height="42" fill="#d35400"/>
      <rect x="70" y="26" width="18" height="48" fill="#7f8c8d"/>
    </g>
    <g transform="translate(96,14)">
      <path d="M 6 34 C -10 24 -6 4 6 0 C 6 12 6 22 6 34 Z" fill="#2e7d32"/>
      <path d="M 12 34 C 28 24 24 4 12 0 C 12 12 12 22 12 34 Z" fill="#43a047"/>
      <path d="M 9 36 C 9 20 9 12 9 0" stroke="#1b5e20" stroke-width="2" fill="none"/>
      <path d="M -8 34 L 26 34 L 20 62 L -2 62 Z" fill="#c0653a"/>
    </g>
    <!-- 节拍器 -->
    <g transform="translate(178,50)">
      <path d="M 8 66 L 38 66 L 30 0 L 16 0 Z" fill="#c9a227" stroke="#8a6d15" stroke-width="3"/>
      <path d="M 12 20 L 34 20 L 32 8 L 14 8 Z" fill="#1b1b1b"/>
      <rect x="21" y="6" width="3" height="52" fill="#1b1b1b"/>
      <circle cx="23" cy="46" r="5" fill="#e74c3c"/>
    </g>
  </g>

  <!-- ===== 立式钢琴 ===== -->
  <g id="c-piano">
    <rect x="132" y="118" width="500" height="26" rx="8" fill="#5f2c14"/>
    <rect x="132" y="118" width="500" height="10" rx="5" fill="#d5834e" opacity="0.7"/>
    <rect x="140" y="144" width="484" height="220" rx="10" fill="url(#c-wood)" stroke="#4a2210" stroke-width="4"/>
    <rect x="162" y="164" width="440" height="132" rx="6" fill="#6d3418"/>
    <rect x="162" y="164" width="440" height="132" rx="6" fill="none" stroke="#3f1c0a" stroke-width="3"/>
    <g stroke="#a55a2e" stroke-width="2" fill="none" opacity="0.55">
      <path d="M 168 190 C 300 184 460 194 596 186"/>
      <path d="M 168 224 C 320 218 440 228 596 220"/>
      <path d="M 168 258 C 300 254 460 262 596 254"/>
      <path d="M 168 286 C 340 280 430 288 596 280"/>
    </g>
    <!-- 谱架与乐谱 -->
    <rect x="286" y="164" width="200" height="106" rx="4" fill="#4a2210"/>
    <path d="M 296 176 L 476 168 L 476 258 L 296 252 Z" fill="#fffdf5" stroke="#cbb894" stroke-width="2"/>
    <g stroke="#8a7f6a" stroke-width="2">
      <path d="M 312 190 L 460 184"/><path d="M 312 206 L 460 200"/>
      <path d="M 312 222 L 460 216"/><path d="M 312 238 L 460 232"/>
    </g>
    <g fill="#3a3a3a">
      <ellipse cx="330" cy="192" rx="6" ry="4.2"/><rect x="335" y="168" width="2.4" height="24"/>
      <ellipse cx="368" cy="208" rx="6" ry="4.2"/><rect x="373" y="184" width="2.4" height="24"/>
      <ellipse cx="420" cy="202" rx="6" ry="4.2"/><rect x="425" y="178" width="2.4" height="24"/>
      <ellipse cx="446" cy="240" rx="6" ry="4.2"/><rect x="451" y="216" width="2.4" height="24"/>
    </g>
    <!-- 蜡烛 -->
    <g transform="translate(660,220)">
      <rect x="0" y="20" width="18" height="52" rx="4" fill="#fdf6e3" stroke="#ddcfae" stroke-width="2"/>
      <path d="M 9 20 C 0 10 18 4 9 -8 C 22 2 20 16 9 20 Z" fill="#ffb347">
        <animate attributeName="opacity" values="1;0.72;1;0.86;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <circle cx="9" cy="2" r="40" fill="url(#c-lamp)"/>
      <ellipse cx="9" cy="74" rx="18" ry="6" fill="#b8862b"/>
    </g>
    <!-- 键盘 -->
    <rect x="132" y="364" width="500" height="20" rx="6" fill="#5f2c14"/>
    <rect x="140" y="384" width="484" height="64" fill="#4a2210"/>
    <g>
      <rect x="148" y="374" width="468" height="62" fill="#fbf8ee" stroke="#c9c2ae" stroke-width="2"/>
      <g stroke="#bdb6a2" stroke-width="1.6">
        <path d="M 187 374 V 436 M 226 374 V 436 M 265 374 V 436 M 304 374 V 436
                 M 343 374 V 436 M 382 374 V 436 M 421 374 V 436 M 460 374 V 436
                 M 499 374 V 436 M 538 374 V 436 M 577 374 V 436"/>
      </g>
      <g fill="#1b1b1b" stroke="#000" stroke-width="1">
        <rect x="167" y="374" width="20" height="38" rx="3"/><rect x="206" y="374" width="20" height="38" rx="3"/>
        <rect x="284" y="374" width="20" height="38" rx="3"/><rect x="323" y="374" width="20" height="38" rx="3"/><rect x="362" y="374" width="20" height="38" rx="3"/>
        <rect x="440" y="374" width="20" height="38" rx="3"/><rect x="479" y="374" width="20" height="38" rx="3"/>
        <rect x="557" y="374" width="20" height="38" rx="3"/><rect x="596" y="374" width="20" height="38" rx="3"/>
      </g>
    </g>
    <!-- 下板、踏板与琴腿 -->
    <rect x="152" y="448" width="460" height="48" rx="8" fill="#6d3418" stroke="#3f1c0a" stroke-width="3"/>
    <rect x="152" y="448" width="460" height="10" rx="5" fill="#a55a2e" opacity="0.7"/>
    <g fill="#c9a227" stroke="#8a6d15" stroke-width="2">
      <rect x="352" y="480" width="30" height="42" rx="8"/>
      <rect x="400" y="480" width="30" height="42" rx="8"/>
      <rect x="448" y="480" width="30" height="42" rx="8"/>
    </g>
    <rect x="160" y="496" width="34" height="76" rx="6" fill="#5f2c14"/>
    <rect x="570" y="496" width="34" height="76" rx="6" fill="#5f2c14"/>
    <rect x="366" y="522" width="28" height="50" rx="5" fill="#5f2c14"/>
  </g>

  <!-- ===== 琴凳 ===== -->
  <g>
    <rect x="300" y="540" width="24" height="66" rx="6" fill="#7a3c1b"/>
    <rect x="476" y="540" width="24" height="66" rx="6" fill="#7a3c1b"/>
    <rect x="284" y="512" width="232" height="26" rx="8" fill="url(#c-wood2)" stroke="#4a2210" stroke-width="3"/>
    <rect x="284" y="504" width="232" height="16" rx="7" fill="#9b4a5a" stroke="#6d3341" stroke-width="2"/>
    <g stroke="#7f3a48" stroke-width="2" opacity="0.8">
      <path d="M 300 506 V 518 M 330 506 V 518 M 360 506 V 518 M 390 506 V 518
               M 420 506 V 518 M 450 506 V 518 M 480 506 V 518"/>
    </g>
  </g>

  <!-- ===== 猫 ===== -->
  <g id="c-cat">
    <!-- 尾巴（搭在琴凳右侧，白尾尖） -->
    <path d="M 480 500 C 596 512 620 452 556 428"
          fill="none" stroke="#c96a22" stroke-width="30" stroke-linecap="round" opacity="0.35"/>
    <path d="M 480 500 C 596 512 620 452 556 428"
          fill="none" stroke="#e8873a" stroke-width="30" stroke-linecap="round"/>
    <path d="M 604 466 C 610 446 594 431 562 429"
          fill="none" stroke="#fff6ea" stroke-width="30" stroke-linecap="round"/>

    <!-- 后腿与臀部（坐琴凳） -->
    <ellipse cx="400" cy="486" rx="92" ry="46" fill="#e8873a"/>
    <ellipse cx="400" cy="486" rx="92" ry="46" fill="none" stroke="#c96a22" stroke-width="3" opacity="0.55"/>

    <!-- 躯干 -->
    <path d="M 322 470 C 306 396 336 322 400 316 C 464 322 494 396 478 470 C 452 508 348 508 322 470 Z"
          fill="#e8873a" stroke="#c96a22" stroke-width="3"/>
    <g stroke="#c96a22" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M 348 350 C 360 360 372 366 384 368"/>
      <path d="M 452 350 C 440 360 428 366 416 368"/>
      <path d="M 340 392 C 356 402 372 408 388 410"/>
      <path d="M 460 392 C 444 402 428 408 412 410"/>
      <path d="M 334 434 C 352 444 370 450 386 452"/>
      <path d="M 466 434 C 448 444 430 450 414 452"/>
    </g>
    <ellipse cx="400" cy="420" rx="46" ry="62" fill="#fff6ea" opacity="0.9"/>

    <!-- 前臂：从胸口向外下方伸到琴键，爪子明确落键 -->
    <g stroke-linecap="round" fill="none">
      <path d="M 372 334 C 342 340 324 356 321 378" stroke="#c96a22" stroke-width="30"/>
      <path d="M 428 334 C 458 340 476 356 479 378" stroke="#c96a22" stroke-width="30"/>
      <path d="M 372 334 C 342 340 324 356 321 378" stroke="#f3a35c" stroke-width="22"/>
      <path d="M 428 334 C 458 340 476 356 479 378" stroke="#f3a35c" stroke-width="22"/>
    </g>

    <!-- 头 -->
    <g>
      <path d="M 348 232 L 336 156 L 404 200 Z" fill="#e8873a" stroke="#c96a22" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 358 226 L 352 176 L 396 202 Z" fill="#f4a9a0"/>
      <path d="M 452 232 L 464 156 L 396 200 Z" fill="#e8873a" stroke="#c96a22" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 442 226 L 448 176 L 404 202 Z" fill="#f4a9a0"/>
      <circle cx="400" cy="270" r="80" fill="#e8873a" stroke="#c96a22" stroke-width="4"/>
      <g stroke="#c96a22" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M 372 210 C 380 230 388 244 396 254"/>
        <path d="M 400 200 C 402 224 404 240 406 254"/>
        <path d="M 428 210 C 420 230 412 244 404 254"/>
      </g>
      <g>
        <ellipse cx="366" cy="268" rx="22" ry="26" fill="#fff"/>
        <ellipse cx="434" cy="268" rx="22" ry="26" fill="#fff"/>
        <ellipse cx="366" cy="272" rx="13" ry="18" fill="#2fbf6d"/>
        <ellipse cx="434" cy="272" rx="13" ry="18" fill="#2fbf6d"/>
        <ellipse cx="366" cy="272" rx="5" ry="14" fill="#1b1b1b"/>
        <ellipse cx="434" cy="272" rx="5" ry="14" fill="#1b1b1b"/>
        <circle cx="358" cy="258" r="6" fill="#fff"/>
        <circle cx="426" cy="258" r="6" fill="#fff"/>
        <path d="M 344 240 C 356 232 372 230 384 232" stroke="#c96a22" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M 456 240 C 444 232 428 230 416 232" stroke="#c96a22" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
      <ellipse cx="400" cy="318" rx="40" ry="26" fill="#fff6ea"/>
      <path d="M 400 304 l 9 -8 l -18 0 z" fill="#f0847f"/>
      <path d="M 400 306 V 316" stroke="#b98a5e" stroke-width="3"/>
      <path d="M 400 316 C 390 328 378 328 372 320" stroke="#b98a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 400 316 C 410 328 422 328 428 320" stroke="#b98a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g stroke="#fffaf2" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path d="M 366 310 C 330 300 306 296 282 300"/>
        <path d="M 366 322 C 330 324 304 330 282 338"/>
        <path d="M 370 332 C 338 344 318 356 302 370"/>
        <path d="M 434 310 C 470 300 494 296 518 300"/>
        <path d="M 434 322 C 470 324 496 330 518 338"/>
        <path d="M 430 332 C 462 344 482 356 498 370"/>
      </g>
    </g>

    <!-- 领结 -->
    <g transform="translate(400,392)">
      <path d="M -6 0 L -34 -16 L -34 16 Z" fill="#2f8fbf" stroke="#226b91" stroke-width="3"/>
      <path d="M 6 0 L 34 -16 L 34 16 Z" fill="#2f8fbf" stroke="#226b91" stroke-width="3"/>
      <circle r="9" fill="#3fa8d8" stroke="#226b91" stroke-width="3"/>
    </g>

    <!-- 落在白键上的双爪（带琴键阴影，强化“正在按键”） -->
    <g>
      <ellipse cx="322" cy="404" rx="29" ry="9" fill="#8a5a2b" opacity="0.28"/>
      <ellipse cx="478" cy="404" rx="29" ry="9" fill="#8a5a2b" opacity="0.28"/>
      <ellipse cx="322" cy="388" rx="27" ry="15" fill="#efa052" stroke="#c96a22" stroke-width="3"/>
      <g stroke="#c96a22" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
        <path d="M 308 386 V 396 M 322 386 V 398 M 336 386 V 396"/>
      </g>
      <ellipse cx="322" cy="391" rx="23" ry="7" fill="#fff6ea" opacity="0.7"/>
      <ellipse cx="478" cy="388" rx="27" ry="15" fill="#efa052" stroke="#c96a22" stroke-width="3"/>
      <g stroke="#c96a22" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
        <path d="M 464 386 V 396 M 478 386 V 398 M 492 386 V 396"/>
      </g>
      <ellipse cx="478" cy="391" rx="23" ry="7" fill="#fff6ea" opacity="0.7"/>
    </g>
  </g>

  <!-- 毛线球 -->
  <g transform="translate(680,506)">
    <circle r="30" fill="#c0392b"/>
    <g stroke="#8e2820" stroke-width="2.4" fill="none">
      <path d="M -26 -12 C -6 4 12 -10 24 4"/>
      <path d="M -22 10 C -4 26 14 6 26 18"/>
      <path d="M -30 2 C -12 -12 10 12 30 -4"/>
    </g>
    <path d="M 26 12 C 46 22 56 40 50 60" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 烛光 -->
  <ellipse cx="669" cy="240" rx="150" ry="170" fill="url(#c-lamp)" opacity="0.55" pointer-events="none"/>

  <!-- 飘动的音符 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 4; 0 -14; 0 4" dur="6s" repeatCount="indefinite"/>
    <g fill="#e8a33d" opacity="0.95">
      <g transform="translate(206,296)">
        <ellipse rx="10" ry="7" transform="rotate(-20)"/>
        <rect x="7" y="-42" width="3.6" height="42"/>
        <path d="M 10.6 -42 C 24 -42 30 -28 28 -10 C 23 -20 16 -21 10.6 -23 Z"/>
      </g>
      <g transform="translate(140,196) scale(0.85)">
        <ellipse rx="10" ry="7" transform="rotate(-20)"/>
        <rect x="7" y="-42" width="3.6" height="42"/>
        <path d="M 10.6 -42 C 24 -42 30 -28 28 -10 C 23 -20 16 -21 10.6 -23 Z"/>
      </g>
      <g transform="translate(700,168) scale(0.9)">
        <ellipse rx="10" ry="7" transform="rotate(-20)"/>
        <rect x="7" y="-42" width="3.6" height="42"/>
        <path d="M 10.6 -42 C 24 -42 30 -28 28 -10 C 23 -20 16 -21 10.6 -23 Z"/>
      </g>
    </g>
  </g>
</svg>
