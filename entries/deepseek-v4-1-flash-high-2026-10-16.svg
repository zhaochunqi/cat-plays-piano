      <path d="M 141 396 C 154 390, 162 388, 173 388"/>
      <path d="M 168 316 C 178 322, 182 328, 186 336"/>
      <path d="M 150 430 C 164 426, 174 424, 184 424"/>
    </g>

    <!-- white chest bib -->
    <path d="M 226 306 C 254 322, 264 366, 256 404 C 250 434, 228 454, 202 460 C 224 434, 236 396, 230 356 C 227 336, 226 320, 226 306 Z" fill="#FFF6E8"/>

    <!-- far front leg (behind) -->
