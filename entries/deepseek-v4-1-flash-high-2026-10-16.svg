    <path d="M 238 328 C 272 342, 302 364, 330 384" fill="none" stroke="url(#furFar)" stroke-width="21" stroke-linecap="round"/>
    <ellipse cx="330" cy="396" rx="19" ry="12" fill="#FBEEDC" stroke="#DFA974" stroke-width="1.8"/>
    <g stroke="#D9A46F" stroke-width="1.6" stroke-linecap="round">
      <line x1="326" y1="387" x2="326" y2="405"/>
      <line x1="333" y1="386" x2="333" y2="406"/>
    </g>

    <!-- near front leg -->
    <ellipse cx="226" cy="342" rx="27" ry="30" fill="url(#fur)"/>
    <path d="M 226 344 C 244 362, 258 380, 268 394" fill="none" stroke="#C96A25" stroke-width="26" stroke-linecap="round"/>
    <path d="M 226 344 C 244 362, 258 380, 268 394" fill="none" stroke="url(#fur)" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="278" cy="400" rx="19" ry="12" fill="#FFF6E8" stroke="#DFA974" stroke-width="1.8"/>
    <g stroke="#D9A46F" stroke-width="1.6" stroke-linecap="round">
      <line x1="274" y1="391" x2="274" y2="409"/>
      <line x1="281" y1="390" x2="281" y2="410"/>
    </g>

    <!-- ears -->
    <path d="M 194 218 L 208 168 L 244 200 Z" fill="url(#fur)"/>
    <path d="M 204 210 L 210 180 L 232 199 Z" fill="#F3B0BD"/>
    <path d="M 262 200 L 296 174 L 292 222 Z" fill="url(#fur)"/>
    <path d="M 268 200 L 289 185 L 287 215 Z" fill="#F3B0BD"/>

    <!-- head -->
    <circle cx="236" cy="264" r="52" fill="url(#fur)"/>
    <path d="M 194 246 C 208 234, 226 230, 244 234 C 262 238, 274 248, 280 260 C 268 254, 252 250, 236 250 C 218 250, 202 250, 194 246 Z" fill="#D97A32" opacity="0.45"/>
    <g fill="none" stroke="#D97A32" stroke-width="6" stroke-linecap="round">
      <path d="M 214 220 C 220 216, 226 214, 232 214"/>
      <path d="M 238 218 C 244 214, 250 213, 256 214"/>
    </g>
    <!-- cheek fluff -->
