      </g>
      <g fill="#3A2A22">
        <ellipse cx="392" cy="238" rx="5.4" ry="4" transform="rotate(-18 392 238)"/>
        <rect x="396" y="222" width="2.4" height="16"/>
        <ellipse cx="432" cy="232" rx="5.4" ry="4" transform="rotate(-18 432 232)"/>
        <rect x="436" y="216" width="2.4" height="16"/>
        <ellipse cx="466" cy="246" rx="5.4" ry="4" transform="rotate(-18 466 246)"/>
        <rect x="470" y="230" width="2.4" height="16"/>
        <ellipse cx="486" cy="230" rx="5.4" ry="4" transform="rotate(-18 486 230)"/>
        <rect x="490" y="214" width="2.4" height="16"/>
      </g>
      <path d="M 372 258 C 366 244, 376 236, 372 226 C 368 216, 380 214, 378 224 C 376 234, 374 250, 378 254" fill="none" stroke="#3A2A22" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- fallboard -->
  <rect x="256" y="376" width="352" height="10" fill="#1D110B" opacity="0.6"/>

  <!-- keyboard -->
  <rect x="252" y="384" width="360" height="34" fill="url(#keyFront)"/>
  <!-- keys being pressed under the paws -->
  <g>
    <rect x="269.1" y="388" width="17.1" height="30" fill="#E7DBBF"/>
    <rect x="303.4" y="388" width="17.1" height="30" fill="#E7DBBF"/>
    <rect x="354.9" y="388" width="17.1" height="30" fill="#E7DBBF"/>
