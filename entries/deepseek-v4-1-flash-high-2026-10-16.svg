    <line x1="337.7" y1="384" x2="337.7" y2="418"/>
    <line x1="354.9" y1="384" x2="354.9" y2="418"/>
    <line x1="372" y1="384" x2="372" y2="418"/>
    <line x1="389.1" y1="384" x2="389.1" y2="418"/>
    <line x1="406.3" y1="384" x2="406.3" y2="418"/>
    <line x1="423.4" y1="384" x2="423.4" y2="418"/>
    <line x1="440.6" y1="384" x2="440.6" y2="418"/>
    <line x1="457.7" y1="384" x2="457.7" y2="418"/>
