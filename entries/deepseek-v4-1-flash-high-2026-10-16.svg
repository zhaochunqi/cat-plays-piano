<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" role="img" aria-label="A ginger tabby cat playing an upright piano">
  <title>Cat playing the piano</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9E9CE"/>
      <stop offset="0.55" stop-color="#F2DCBB"/>
      <stop offset="1" stop-color="#E8CFA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="42%" r="62%">
      <stop offset="0" stop-color="#FFF6DE" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFEFC9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFEFC9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98B57"/>
      <stop offset="1" stop-color="#A05F33"/>
    </linearGradient>
    <radialGradient id="rug" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#CE6249"/>
      <stop offset="0.72" stop-color="#B84A34"/>
      <stop offset="1" stop-color="#9A3B27"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E3C2B"/>
      <stop offset="0.55" stop-color="#43291D"/>
      <stop offset="1" stop-color="#2C1A12"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5140"/>
      <stop offset="1" stop-color="#543427"/>
    </linearGradient>
    <linearGradient id="keyFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F7F0E2"/>
      <stop offset="1" stop-color="#E7DCC7"/>
    </linearGradient>
    <linearGradient id="blackKey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B3B33"/>
      <stop offset="0.28" stop-color="#241C19"/>
      <stop offset="1" stop-color="#15100E"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F8A757"/>
      <stop offset="0.6" stop-color="#F0913C"/>
      <stop offset="1" stop-color="#DE7C2E"/>
    </linearGradient>
    <linearGradient id="furFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E68C36"/>
      <stop offset="1" stop-color="#CE7327"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.35" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#9AD07F"/>
      <stop offset="0.6" stop-color="#5E9E56"/>
      <stop offset="1" stop-color="#3B6E3C"/>
    </radialGradient>
    <radialGradient id="light" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFF7E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF7E2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .note { animation: drift 4.6s ease-in-out infinite; transform-box: fill-box; }
      .n1 { animation-delay: 0s; }
      .n2 { animation-delay: 0.9s; }
      .n3 { animation-delay: 1.8s; }
      .n4 { animation-delay: 2.7s; }
      .n5 { animation-delay: 3.4s; }
      @keyframes drift {
        0%   { opacity: 0; transform: translate(0, 22px) scale(0.86); }
        18%  { opacity: 1; transform: translate(0, 6px) scale(0.98); }
        70%  { opacity: 0.95; transform: translate(-6px, -40px) scale(1.04); }
        100% { opacity: 0; transform: translate(-12px, -78px) scale(1.08); }
      }
    </style>
  </defs>

  <!-- ===================== room ===================== -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#glow)"/>
  <rect x="0" y="468" width="800" height="132" fill="url(#floor)"/>
  <g stroke="#8E5127" stroke-opacity="0.45" stroke-width="2">
    <line x1="0" y1="492" x2="800" y2="492"/>
    <line x1="0" y1="532" x2="800" y2="532"/>
    <line x1="0" y1="574" x2="800" y2="574"/>
    <line x1="180" y1="468" x2="120" y2="600"/>
    <line x1="470" y1="468" x2="500" y2="600"/>
    <line x1="700" y1="468" x2="760" y2="600"/>
  </g>
  <line x1="0" y1="468" x2="800" y2="468" stroke="#7E4722" stroke-width="3" stroke-opacity="0.55"/>

  <!-- rug -->
  <ellipse cx="380" cy="516" rx="330" ry="70" fill="url(#rug)"/>
  <ellipse cx="380" cy="516" rx="292" ry="58" fill="none" stroke="#E9B693" stroke-opacity="0.55" stroke-width="3"/>
  <ellipse cx="380" cy="516" rx="250" ry="46" fill="none" stroke="#E9B693" stroke-opacity="0.28" stroke-width="8"/>

  <!-- framed picture (a fish — the cat's muse) -->
  <g transform="translate(60,50)">
    <rect x="0" y="0" width="118" height="112" rx="5" fill="#6B4634"/>
    <rect x="7" y="7" width="104" height="98" rx="3" fill="#FBF1DC"/>
    <rect x="14" y="14" width="90" height="84" rx="2" fill="#EAF2F6"/>
