    <rect x="240" y="372" width="20" height="62" rx="4"/>
    <rect x="604" y="372" width="20" height="62" rx="4"/>
  </g>

  <!-- front panel details -->
  <rect x="262" y="312" width="340" height="58" rx="4" fill="#26160F" opacity="0.45"/>
  <rect x="262" y="312" width="340" height="4" rx="2" fill="#7A5140" opacity="0.6"/>
  <rect x="262" y="368" width="340" height="8" fill="#1C110B" opacity="0.5"/>

  <!-- music stand + sheet -->
  <g>
    <rect x="336" y="192" width="196" height="104" rx="5" fill="#1F120C" opacity="0.5"/>
    <rect x="342" y="196" width="184" height="94" rx="4" fill="#2B1A12"/>
    <g transform="rotate(-2 434 244)">
      <rect x="356" y="204" width="156" height="78" rx="3" fill="#FFFDF4"/>
      <g stroke="#8A7F6C" stroke-width="1.4">
        <line x1="368" y1="222" x2="500" y2="222"/>
        <line x1="368" y1="232" x2="500" y2="232"/>
        <line x1="368" y1="242" x2="500" y2="242"/>
