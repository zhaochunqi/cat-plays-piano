    <line x1="560.6" y1="384" x2="560.6" y2="418"/>
    <line x1="577.7" y1="384" x2="577.7" y2="418"/>
    <line x1="594.9" y1="384" x2="594.9" y2="418"/>
  </g>
  <g fill="url(#blackKey)">
    <rect x="263.6" y="384" width="11" height="18" rx="2"/>
    <rect x="280.8" y="384" width="11" height="18" rx="2"/>
    <rect x="315.1" y="384" width="11" height="18" rx="2"/>
    <rect x="332.2" y="384" width="11" height="18" rx="2"/>
    <rect x="349.4" y="384" width="11" height="18" rx="2"/>
    <rect x="383.6" y="384" width="11" height="18" rx="2"/>
    <rect x="400.8" y="384" width="11" height="18" rx="2"/>
    <rect x="435.1" y="384" width="11" height="18" rx="2"/>
    <rect x="452.2" y="384" width="11" height="18" rx="2"/>
    <rect x="469.4" y="384" width="11" height="18" rx="2"/>
    <rect x="503.6" y="384" width="11" height="18" rx="2"/>
    <rect x="520.8" y="384" width="11" height="18" rx="2"/>
    <rect x="555.1" y="384" width="11" height="18" rx="2"/>
    <rect x="572.2" y="384" width="11" height="18" rx="2"/>
    <rect x="589.4" y="384" width="11" height="18" rx="2"/>
  </g>
  <!-- key slip -->
  <rect x="244" y="418" width="376" height="16" rx="4" fill="#3A2418"/>
  <rect x="244" y="418" width="376" height="4" rx="2" fill="#6B4634"/>

  <!-- vase on the lid -->
  <g transform="translate(566,86)">
    <path d="M 16 0 C 24 -18, 34 -22, 42 -34" fill="none" stroke="#7E9E5C" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 22 4 C 22 -12, 16 -22, 6 -30" fill="none" stroke="#7E9E5C" stroke-width="2.6" stroke-linecap="round"/>
