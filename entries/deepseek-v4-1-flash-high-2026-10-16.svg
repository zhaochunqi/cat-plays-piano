  <!-- ===================== music ===================== -->
  <g>
    <path d="M 296 380 C 340 330, 420 300, 520 288" fill="none" stroke="#D9A94A" stroke-width="2.6" stroke-dasharray="7 9" opacity="0.75"/>
    <path d="M 330 356 C 380 320, 470 292, 574 280" fill="none" stroke="#D9A94A" stroke-width="2.6" stroke-dasharray="7 9" opacity="0.55"/>
  </g>
  <g fill="#C99A34">
    <g class="note n1" transform="translate(352,318)">
      <ellipse cx="0" cy="0" rx="8.5" ry="6.2" transform="rotate(-18)"/>
      <rect x="6.6" y="-30" width="3.4" height="30"/>
      <path d="M 6.6 -30 C 22 -30, 26 -18, 24 -4 C 20 -14, 12 -18, 6.6 -20 Z"/>
    </g>
    <g class="note n2" transform="translate(432,286)">
      <ellipse cx="0" cy="0" rx="8.5" ry="6.2" transform="rotate(-18)"/>
      <ellipse cx="20" cy="-6" rx="8.5" ry="6.2" transform="rotate(-18 20 -6)"/>
      <rect x="6.6" y="-32" width="3.4" height="32"/>
      <rect x="26.6" y="-38" width="3.4" height="32"/>
      <polygon points="6.6,-32 30,-38 30,-30 6.6,-24"/>
    </g>
    <g class="note n3" transform="translate(520,262)">
      <ellipse cx="0" cy="0" rx="8.5" ry="6.2" transform="rotate(-18)"/>
      <rect x="6.6" y="-30" width="3.4" height="30"/>
      <path d="M 6.6 -30 C 22 -30, 26 -18, 24 -4 C 20 -14, 12 -18, 6.6 -20 Z"/>
    </g>
    <g class="note n4" transform="translate(600,306)">
