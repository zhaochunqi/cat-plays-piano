      <path d="M -22 0 L -40 -15 L -40 15 Z" fill="#5D9BC0"/>
      <circle cx="10" cy="-3" r="3.4" fill="#1E3B4C"/>
      <path d="M -6 -14 C -2 -6, -2 6, -6 14" fill="none" stroke="#5D9BC0" stroke-width="2.4"/>
    </g>
    <circle cx="34" cy="34" r="4" fill="#BEDCEA"/>
    <circle cx="44" cy="24" r="2.6" fill="#BEDCEA"/>
  </g>

  <!-- ===================== piano ===================== -->
  <ellipse cx="432" cy="492" rx="230" ry="26" fill="#6B3F1E" opacity="0.3"/>

  <!-- front legs -->
  <g fill="#33200F">
    <rect x="268" y="430" width="26" height="56" rx="4"/>
    <rect x="576" y="430" width="26" height="56" rx="4"/>
    <rect x="262" y="480" width="38" height="10" rx="4" fill="#7A4A22"/>
    <rect x="570" y="480" width="38" height="10" rx="4" fill="#7A4A22"/>
  </g>
  <!-- pedals -->
  <g fill="#C9A44C">
