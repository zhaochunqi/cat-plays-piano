    <ellipse cx="43" cy="-36" rx="7" ry="6" fill="#E88AA2"/>
    <ellipse cx="5" cy="-32" rx="7" ry="6" fill="#F0A9BC"/>
    <ellipse cx="53" cy="-18" rx="6.6" ry="5.6" fill="#E88AA2"/>
    <path d="M 10 4 C 6 22, 10 30, 24 30 C 38 30, 44 22, 40 4 Z" fill="#C98B57"/>
    <path d="M 10 4 C 6 22, 10 30, 24 30 C 38 30, 44 22, 40 4 Z" fill="#8FB0C4" opacity="0.55"/>
    <rect x="8" y="0" width="34" height="8" rx="3" fill="#B57C4C"/>
  </g>

  <!-- ===================== bench ===================== -->
  <g>
    <rect x="118" y="470" width="180" height="18" rx="7" fill="#8A5A35"/>
    <rect x="118" y="470" width="180" height="6" rx="3" fill="#A67246"/>
    <rect x="132" y="488" width="16" height="26" rx="4" fill="#6E4426"/>
    <rect x="268" y="488" width="16" height="26" rx="4" fill="#6E4426"/>
    <rect x="132" y="500" width="152" height="8" rx="4" fill="#7A4E2C"/>
    <ellipse cx="210" cy="516" rx="118" ry="12" fill="#6B3F1E" opacity="0.25"/>
  </g>

  <!-- ===================== cat ===================== -->
  <g id="cat">
    <!-- tail (sways) -->
    <g>
      <path d="M 152 452 C 104 470, 62 434, 70 382 C 76 340, 58 318, 34 312" fill="none" stroke="#C96A25" stroke-width="29" stroke-linecap="round"/>
      <path d="M 152 452 C 104 470, 62 434, 70 382 C 76 340, 58 318, 34 312" fill="none" stroke="url(#fur)" stroke-width="25" stroke-linecap="round"/>
      <path d="M 152 452 C 104 470, 62 434, 70 382 C 76 340, 58 318, 34 312" fill="none" stroke="#D97A32" stroke-width="25" stroke-linecap="butt" stroke-dasharray="10 30" opacity="0.9"/>
      <path d="M 46 318 C 40 316, 34 313, 30 311" fill="none" stroke="#FFF6E8" stroke-width="24" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 150 452; 3 150 452; -3 150 452" keyTimes="0; 0.5; 1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </g>

    <!-- haunch + hind foot -->
    <ellipse cx="178" cy="424" rx="63" ry="49" fill="url(#fur)"/>
    <ellipse cx="212" cy="464" rx="30" ry="15" fill="#FFF6E8"/>
    <g stroke="#E6CBB0" stroke-width="1.6">
      <line x1="206" y1="454" x2="206" y2="474"/>
      <line x1="218" y1="453" x2="218" y2="475"/>
