<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Piano -->
  <g id="piano">
    <!-- Piano body -->
    <rect x="100" y="180" width="200" height="80" fill="#2c2c2c" rx="5"/>
    <rect x="110" y="190" width="180" height="60" fill="#1a1a1a" rx="3"/>
    
    <!-- White keys -->
    <g id="white-keys">
      <rect x="115" y="195" width="20" height="50" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
      <rect x="138" y="195" width="20" height="50" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
      <rect x="161" y="195" width="20" height="50" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
      <rect x="184" y="195" width="20" height="50" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
      <rect x="207" y="195" width="20" height="50" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
      <rect x="230" y="195" width="20" height="50" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
      <rect x="253" y="195" width="20" height="50" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
      <rect x="276" y="195" width="20" height="50" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
    </g>
    
    <!-- Black keys -->
    <g id="black-keys">
      <rect x="128" y="195" width="15" height="30" fill="#1a1a1a"/>
      <rect x="151" y="195" width="15" height="30" fill="#1a1a1a"/>
      <rect x="194" y="195" width="15" height="30" fill="#1a1a1a"/>
      <rect x="217" y="195" width="15" height="30" fill="#1a1a1a"/>
      <rect x="240" y="195" width="15" height="30" fill="#1a1a1a"/>
    </g>
  </g>
  
  <!-- Cat -->
  <g id="cat">
    <!-- Body -->
    <ellipse cx="150" cy="150" rx="35" ry="40" fill="#d4a574"/>
    
    <!-- Head -->
    <circle cx="120" cy="130" r="25" fill="#d4a574"/>
    
    <!-- Ears -->
    <path d="M 100 115 L 105 100 L 110 115 Z" fill="#d4a574"/>
    <path d="M 130 115 L 135 100 L 140 115 Z" fill="#d4a574"/>
    <path d="M 102 108 L 105 103 L 108 108 Z" fill="#ff9999"/>
    <path d="M 132 108 L 135 103 L 138 108 Z" fill="#ff9999"/>
    
    <!-- Face -->
    <circle cx="110" cy="130" r="2" fill="#000000"/>
    <circle cx="130" cy="130" r="2" fill="#000000"/>
    <path d="M 115 140 Q 120 145 125 140" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Whiskers -->
    <line x1="95" y1="130" x2="85" y2="128" stroke="#000000" stroke-width="1"/>
    <line x1="95" y1="135" x2="85" y2="135" stroke="#000000" stroke-width="1"/>
    <line x1="145" y1="130" x2="155" y2="128" stroke="#000000" stroke-width="1"/>
    <line x1="145" y1="135" x2="155" y2="135" stroke="#000000" stroke-width="1"/>
    
    <!-- Front paws on piano -->
    <ellipse cx="135" cy="175" rx="8" ry="12" fill="#d4a574" transform="rotate(-20 135 175)"/>
    <ellipse cx="155" cy="175" rx="8" ry="12" fill="#d4a574" transform="rotate(-20 155 175)"/>
    
    <!-- Paw details -->
    <circle cx="132" cy="173" r="2" fill="#ff9999"/>
    <circle cx="152" cy="173" r="2" fill="#ff9999"/>
    
    <!-- Tail -->
    <path d="M 180 150 Q 200 140 210 160 Q 215 180 200 185" fill="none" stroke="#d4a574" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Musical notes -->
  <g id="musical-notes">
    <g transform="translate(50, 50)">
      <ellipse cx="0" cy="0" rx="4" ry="3" fill="#ff6b6b" transform="rotate(-20)"/>
      <rect x="3" y="-10" width="2" height="10" fill="#ff6b6b"/>
      <path d="M 5 -10 Q 8 -8 10 -6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    </g>
    
    <g transform="translate(320, 60)">
      <ellipse cx="0" cy="0" rx="4" ry="3" fill="#4ecdc4" transform="rotate(20)"/>
      <rect x="3" y="-10" width="2" height="10" fill="#4ecdc4"/>
    </g>
    
    <g transform="translate(280, 40)">
      <ellipse cx="0" cy="0" rx="4" ry="3" fill="#ffe66d" transform="rotate(-10)"/>
      <rect x="3" y="-10" width="2" height="10" fill="#ffe66d"/>
      <path d="M 5 -10 Q 8 -8 10 -6" fill="none" stroke="#ffe66d" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Piano legs -->
  <rect x="120" y="260" width="8" height="20" fill="#2c2c2c"/>
  <rect x="272" y="260" width="8" height="20" fill="#2c2c2c"/>
</svg>
