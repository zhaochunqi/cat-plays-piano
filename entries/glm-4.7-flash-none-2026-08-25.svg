<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for a modern look -->
    <linearGradient id="pianoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#f4f6f7" />
  <circle cx="300" cy="300" r="220" fill="#e8eaed" />

  <!-- Piano Body -->
  <g transform="translate(100, 200)">
    <!-- The main curve of the grand piano -->
    <path d="M0,200 C0,50 150,0 300,0 L300,200 L0,200 Z" fill="url(#pianoGradient)" />
    
    <!-- The Lid -->
    <path d="M300,0 L480,-80 L480,0 L300,0 Z" fill="url(#pianoGradient)" />
    
    <!-- Prop stick for lid -->
    <line x1="300" y1="0" x2="380" y2="-60" stroke="#1a1a1a" stroke-width="3" />

    <!-- Keyboard Area -->
    <rect x="20" y="200" width="260" height="30" fill="#ffffff" />
    <!-- Black Keys -->
    <g fill="#1a1a1a">
      <rect x="30" y="200" width="15" height="18" />
      <rect x="50" y="200" width="15" height="18" />
      <rect x="90" y="200" width="15" height="18" />
      <rect x="110" y="200" width="15" height="18" />
      <rect x="130" y="200" width="15" height="18" />
      <rect x="170" y="200" width="15" height="18" />
      <rect x="190" y="200" width="15" height="18" />
      <rect x="230" y="200" width="15" height="18" />
      <rect x="250" y="200" width="15" height="18" />
    </g>
  </g>

  <!-- The Cat -->
  <g transform="translate(180, 180)" filter="url(#softShadow)">
    <!-- Tail -->
    <path d="M80,40 Q140,10 160,60 T180,120" stroke="#95a5a6" stroke-width="12" fill="none" stroke-linecap="round" />
    
    <!-- Body -->
    <path d="M40,50 Q90,30 130,50 L120,110 Q90,120 60,110 Z" fill="#bdc3c7" />
    
    <!-- Head -->
    <circle cx="85" cy="35" r="30" fill="#bdc3c7" />
    
    <!-- Ears -->
    <path d="M60,15 L50,-10 L75,10 Z" fill="#bdc3c7" />
    <path d="M110,15 L120,-10 L95,10 Z" fill="#bdc3c7" />
    <path d="M62,12 L55,-5 L72,10 Z" fill="#ecf0f1" /> <!-- Inner ear -->
    <path d="M108,12 L115,-5 L98,10 Z" fill="#ecf0f1" /> <!-- Inner ear -->

    <!-- Paws on keys -->
    <ellipse cx="75" cy="200" rx="12" ry="8" fill="#bdc3c7" transform="translate(0, -10)" />
    <ellipse cx="105" cy="200" rx="12" ry="8" fill="#bdc3c7" transform="translate(0, -10)" />
    
    <!-- Face details (Closed eyes for serenity) -->
    <path d="M70,35 Q75,38 80,35" stroke="#2c3e50" stroke-width="1.5" fill="none" />
    <path d="M90,35 Q95,38 100,35" stroke="#2c3e50" stroke-width="1.5" fill="none" />
    <path d="M78,45 Q85,48 92,45" stroke="#2c3e50" stroke-width="1.5" fill="none" /> <!-- Nose -->
    <path d="M85,45 L85,48" stroke="#2c3e50" stroke-width="1.5" /> <!-- Mouth -->
  </g>

  <!-- Musical Notes -->
  <g fill="#d4af37" opacity="0.8">
    <!-- Note 1 -->
    <g transform="translate(400, 150) rotate(15)">
      <ellipse cx="0" cy="20" rx="6" ry="5" transform="rotate(-20)" />
      <rect x="4" y="-20" width="2" height="40" />
      <path d="M4,-20 Q14,-10 14,0" stroke="#d4af37" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Note 2 -->
    <g transform="translate(450, 100) rotate(-10)">
      <ellipse cx="0" cy="20" rx="6" ry="5" transform="rotate(-20)" />
      <rect x="4" y="-20" width="2" height="40" />
    </g>

    <!-- Note 3 (Simple dot) -->
    <circle cx="380" cy="180" r="4" fill="#d4af37" opacity="0.6" />
  </g>

</svg>
