<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background -->
  <rect width="500" height="400" fill="#f5e6d3"/>
  
  <!-- Music notes floating -->
  <g fill="#6b4f9e">
    <text x="130" y="100" font-size="30" transform="rotate(-15 130 100)">♪</text>
    <text x="170" y="70" font-size="24" transform="rotate(10 170 70)">♫</text>
    <text x="100" y="140" font-size="26" transform="rotate(20 100 140)">♬</text>
    <text x="200" y="110" font-size="22" transform="rotate(-25 200 110)">♩</text>
  </g>
  
  <!-- Piano body -->
  <g>
    <!-- Piano legs -->
    <rect x="130" y="310" width="14" height="70" fill="#4a3728"/>
    <rect x="390" y="310" width="14" height="70" fill="#4a3728"/>
    <!-- Piano main body -->
    <rect x="110" y="230" width="320" height="90" rx="8" fill="#7a5230"/>
    <!-- Piano top edge -->
    <rect x="110" y="230" width="320" height="14" rx="6" fill="#5c3d21"/>
    
    <!-- Keyboard: white keys -->
    <g fill="#fdfdf5" stroke="#c9c9c0" stroke-width="1">
      <rect x="120" y="244" width="28" height="50" rx="2"/>
      <rect x="148" y="244" width="28" height="50" rx="2"/>
      <rect x="176" y="244" width="28" height="50" rx="2"/>
      <rect x="204" y="244" width="28" height="50" rx="2"/>
      <rect x="232" y="244" width="28" height="50" rx="2"/>
      <rect x="260" y="244" width="28" height="50" rx="2"/>
      <rect x="288" y="244" width="28" height="50" rx="2"/>
      <rect x="316" y="244" width="28" height="50" rx="2"/>
      <rect x="344" y="244" width="28" height="50" rx="2"/>
      <rect x="372" y="244" width="28" height="50" rx="2"/>
      <rect x="400" y="244" width="24" height="50" rx="2"/>
    </g>
    
    <!-- Keyboard: black keys -->
    <g fill="#222222">
      <rect x="140" y="244" width="16" height="30" rx="2"/>
      <rect x="196" y="244" width="16" height="30" rx="2"/>
      <rect x="278" y="244" width="16" height="30" rx="2"/>
      <rect x="306" y="244" width="16" height="30" rx="2"/>
      <rect x="334" y="244" width="16" height="30" rx="2"/>
      <rect x="390" y="244" width="16" height="30" rx="2"/>
    </g>
    
    <!-- Depressed key (being played) -->
    <rect x="232" y="244" width="28" height="50" rx="2" fill="#fff3b0" stroke="#c9a53f" stroke-width="1.5"/>
  </g>
  
  <!-- Cat -->
  <g>
    <!-- Tail -->
    <path d="M 130 175 Q 90 160 95 120 Q 98 100 115 105" 
          fill="none" stroke="#e8853a" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Body -->
    <ellipse cx="230" cy="215" rx="95" ry="52" fill="#f0964b"/>
    <!-- Body stripes -->
    <path d="M 200 175 Q 210 200 200 220" fill="none" stroke="#d9772e" stroke-width="8" stroke-linecap="round"/>
    <path d="M 230 170 Q 240 198 230 222" fill="none" stroke="#d9772e" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="300" cy="155" r="55" fill="#f0964b"/>
    
    <!-- Ears -->
    <path d="M 262 118 L 252 75 L 292 98 Z" fill="#f0964b"/>
    <path d="M 266 110 L 261 88 L 282 100 Z" fill="#f7b57e"/>
    <path d="M 340 118 L 350 75 L 310 98 Z" fill="#f0964b"/>
    <path d="M 336 110 L 341 88 L 320 100 Z" fill="#f7b57e"/>
    
    <!-- Head stripes -->
    <path d="M 285 105 Q 290 118 285 128" fill="none" stroke="#d9772e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 302 102 Q 307 116 302 126" fill="none" stroke="#d9772e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 318 105 Q 323 118 318 128" fill="none" stroke="#d9772e" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Face -->
    <circle cx="280" cy="150" r="7" fill="#2d2a26"/>
    <circle cx="282" cy="147" r="2.5" fill="#ffffff"/>
    <circle cx="322" cy="150" r="7" fill="#2d2a26"/>
    <circle cx="324" cy="147" r="2.5" fill="#ffffff"/>
    
    <!-- Nose and mouth -->
    <path d="M 297 168 L 308 168 L 302.5 176 Z" fill="#e37a8a"/>
    <path d="M 302 176 Q 302 184 292 186" fill="none" stroke="#2d2a26" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 302 176 Q 302 184 312 186" fill="none" stroke="#2d2a26" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Whiskers -->
    <g stroke="#7a5230" stroke-width="1.8" stroke-linecap="round">
      <line x1="268" y1="165" x2="238" y2="160"/>
      <line x1="268" y1="172" x2="240" y2="176"/>
      <line x1="337" y1="165" x2="367" y2="160"/>
      <line x1="337" y1="172" x2="365" y2="176"/>
    </g>
    
    <!-- Front legs reaching to keys -->
    <path d="M 250 240 Q 235 275 250 300 Q 255 310 268 308" 
          fill="none" stroke="#f0964b" stroke-width="20" stroke-linecap="round"/>
    <path d="M 295 240 Q 295 275 278 302 Q 272 311 260 310" 
          fill="none" stroke="#f0964b" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Paws on the keys -->
    <ellipse cx="248" cy="248" rx="16" ry="11" fill="#f7b57e"/>
    <ellipse cx="266" cy="254" rx="15" ry="10" fill="#f7b57e"/>
    <!-- Toe lines -->
    <line x1="244" y1="240" x2="244" y2="254" stroke="#d9772e" stroke-width="2"/>
    <line x1="252" y1="240" x2="252" y2="254" stroke="#d9772e" stroke-width="2"/>
    <line x1="263" y1="247" x2="263" y2="261" stroke="#d9772e" stroke-width="2"/>
    <line x1="270" y1="247" x2="270" y2="261" stroke="#d9772e" stroke-width="2"/>
  </g>
  
  <!-- Ground shadow -->
  <ellipse cx="270" cy="385" rx="180" ry="10" fill="#00000022"/>
</svg>
