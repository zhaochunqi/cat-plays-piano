<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f7f1e8"/>

  <!-- Piano -->
  <rect x="230" y="330" width="360" height="120" rx="10" fill="#2b2b2b"/>
  <rect x="250" y="350" width="320" height="55" fill="#fff"/>
  <g stroke="#222" stroke-width="3">
    <line x1="290" y1="350" x2="290" y2="405"/>
    <line x1="330" y1="350" x2="330" y2="405"/>
    <line x1="370" y1="350" x2="370" y2="405"/>
    <line x1="410" y1="350" x2="410" y2="405"/>
    <line x1="450" y1="350" x2="450" y2="405"/>
    <line x1="490" y1="350" x2="490" y2="405"/>
    <line x1="530" y1="350" x2="530" y2="405"/>
  </g>
  <g fill="#111">
    <rect x="275" y="350" width="20" height="32"/>
    <rect x="315" y="350" width="20" height="32"/>
    <rect x="395" y="350" width="20" height="32"/>
    <rect x="435" y="350" width="20" height="32"/>
    <rect x="475" y="350" width="20" height="32"/>
  </g>
  <rect x="270" y="450" width="20" height="90" fill="#333"/>
  <rect x="530" y="450" width="20" height="90" fill="#333"/>

  <!-- Cat body -->
  <ellipse cx="400" cy="250" rx="95" ry="120" fill="#d99a5b"/>
  <ellipse cx="400" cy="270" rx="65" ry="85" fill="#efb978"/>

  <!-- Cat head -->
  <circle cx="400" cy="130" r="90" fill="#d99a5b"/>

  <!-- Ears -->
  <path d="M330 70 L310 10 L375 45 Z" fill="#d99a5b"/>
  <path d="M470 70 L490 10 L425 45 Z" fill="#d99a5b"/>
  <path d="M330 55 L322 25 L355 48 Z" fill="#f49a9a"/>
  <path d="M470 55 L478 25 L445 48 Z" fill="#f49a9a"/>

  <!-- Face -->
  <circle cx="365" cy="125" r="10" fill="#222"/>
  <circle cx="435" cy="125" r="10" fill="#222"/>
  <path d="M390 155 Q400 165 410 155" fill="none" stroke="#222" stroke-width="5"/>
  <path d="M400 150 L400 160" stroke="#222" stroke-width="4"/>
  <path d="M350 150 L300 140" stroke="#555" stroke-width="3"/>
  <path d="M450 150 L500 140" stroke="#555" stroke-width="3"/>

  <!-- Cat paws on keys -->
  <ellipse cx="350" cy="330" rx="25" ry="18" fill="#d99a5b"/>
  <ellipse cx="450" cy="330" rx="25" ry="18" fill="#d99a5b"/>

  <!-- Tail -->
  <path d="M480 260 Q620 220 560 120" fill="none" stroke="#d99a5b" stroke-width="25" stroke-linecap="round"/>

  <!-- Music notes -->
  <g fill="#555">
    <text x="590" y="170" font-size="50">♪</text>
    <text x="650" y="220" font-size="40">♫</text>
  </g>
</svg>
