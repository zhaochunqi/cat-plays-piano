<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f5f0e6"/>

  <!-- Piano body -->
  <rect x="40" y="160" width="320" height="90" rx="8" fill="#2c1810"/>
  <rect x="50" y="150" width="300" height="20" rx="4" fill="#3d2314"/>

  <!-- Piano legs -->
  <rect x="55" y="250" width="18" height="40" fill="#2c1810"/>
  <rect x="327" y="250" width="18" height="40" fill="#2c1810"/>

  <!-- White keys -->
  <g fill="#faf8f5" stroke="#333" stroke-width="1">
    <rect x="55" y="150" width="28" height="100"/>
    <rect x="83" y="150" width="28" height="100"/>
    <rect x="111" y="150" width="28" height="100"/>
    <rect x="139" y="150" width="28" height="100"/>
    <rect x="167" y="150" width="28" height="100"/>
    <rect x="195" y="150" width="28" height="100"/>
    <rect x="223" y="150" width="28" height="100"/>
    <rect x="251" y="150" width="28" height="100"/>
    <rect x="279" y="150" width="28" height="100"/>
    <rect x="307" y="150" width="28" height="100"/>
  </g>

  <!-- Black keys -->
  <g fill="#1a1a1a">
    <rect x="72" y="150" width="16" height="60"/>
    <rect x="100" y="150" width="16" height="60"/>
    <rect x="156" y="150" width="16" height="60"/>
    <rect x="184" y="150" width="16" height="60"/>
    <rect x="212" y="150" width="16" height="60"/>
    <rect x="268" y="150" width="16" height="60"/>
    <rect x="296" y="150" width="16" height="60"/>
  </g>

  <!-- Piano bench -->
  <rect x="140" y="255" width="120" height="12" rx="3" fill="#3d2314"/>
  <rect x="150" y="267" width="12" height="25" fill="#2c1810"/>
  <rect x="238" y="267" width="12" height="25" fill="#2c1810"/>

  <!-- Cat body -->
  <ellipse cx="200" cy="220" rx="55" ry="40" fill="#f4a261"/>

  <!-- Cat head -->
  <circle cx="200" cy="155" r="42" fill="#f4a261"/>

  <!-- Ears -->
  <polygon points="170,130 155,95 185,120" fill="#f4a261"/>
  <polygon points="230,130 245,95 215,120" fill="#f4a261"/>
  <polygon points="172,128 162,105 182,120" fill="#e76f51"/>
  <polygon points="228,128 238,105 218,120" fill="#e76f51"/>

  <!-- Eyes -->
  <ellipse cx="185" cy="150" rx="8" ry="10" fill="#2a9d8f"/>
  <ellipse cx="215" cy="150" rx="8" ry="10" fill="#2a9d8f"/>
  <circle cx="185" cy="152" r="3" fill="#1a1a1a"/>
  <circle cx="215" cy="152" r="3" fill="#1a1a1a"/>
  <circle cx="183" cy="149" r="1.5" fill="white"/>
  <circle cx="213" cy="149" r="1.5" fill="white"/>

  <!-- Nose -->
  <ellipse cx="200" cy="168" rx="6" ry="4" fill="#e76f51"/>

  <!-- Mouth -->
  <path d="M200 172 Q190 182 180 175" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M200 172 Q210 182 220 175" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g stroke="#555" stroke-width="1.2" stroke-linecap="round">
    <line x1="160" y1="165" x2="130" y2="160"/>
    <line x1="160" y1="170" x2="128" y2="170"/>
    <line x1="160" y1="175" x2="130" y2="180"/>
    <line x1="240" y1="165" x2="270" y2="160"/>
    <line x1="240" y1="170" x2="272" y2="170"/>
    <line x1="240" y1="175" x2="270" y2="180"/>
  </g>

  <!-- Front paws on keys -->
  <ellipse cx="165" cy="195" rx="18" ry="12" fill="#f4a261"/>
  <ellipse cx="235" cy="195" rx="18" ry="12" fill="#f4a261"/>
  <!-- Toe beans hint -->
  <circle cx="160" cy="198" r="3" fill="#e76f51" opacity="0.6"/>
  <circle cx="170" cy="198" r="3" fill="#e76f51" opacity="0.6"/>
  <circle cx="230" cy="198" r="3" fill="#e76f51" opacity="0.6"/>
  <circle cx="240" cy="198" r="3" fill="#e76f51" opacity="0.6"/>

  <!-- Tail -->
  <path d="M250 230 Q300 200 310 240 Q315 260 290 255" fill="none" stroke="#f4a261" stroke-width="14" stroke-linecap="round"/>

  <!-- Music notes -->
  <g fill="#264653">
    <circle cx="300" cy="80" r="8"/>
    <rect x="306" y="50" width="3" height="30"/>
    <path d="M309 50 Q330 45 330 65" fill="none" stroke="#264653" stroke-width="3"/>

    <circle cx="340" cy="100" r="7"/>
    <rect x="345" y="75" width="3" height="25"/>
    <path d="M348 75 Q365 70 365 88" fill="none" stroke="#264653" stroke-width="2.5"/>

    <circle cx="90" cy="70" r="6"/>
    <rect x="94" y="48" width="2.5" height="22"/>
  </g>
</svg>
