<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="#f8f1e3"/>
  
  <!-- Floor -->
  <rect x="0" y="380" width="800" height="120" fill="#d4c4a8"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#b8a78a" stroke-width="4"/>

  <!-- Piano body -->
  <rect x="320" y="120" width="380" height="260" rx="12" ry="12" fill="#3d2b1f" stroke="#2c2118" stroke-width="8"/>
  
  <!-- Piano top ledge -->
  <rect x="320" y="120" width="380" height="25" rx="12" ry="12" fill="#2c2118"/>
  
  <!-- Keyboard area -->
  <rect x="330" y="310" width="360" height="70" rx="4" fill="#2c2118"/>
  
  <!-- White keys -->
  <!-- Key 1 (C) -->
  <rect x="340" y="315" width="38" height="58" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Key 2 (D) -->
  <rect x="380" y="315" width="38" height="58" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Key 3 (E) -->
  <rect x="420" y="315" width="38" height="58" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Key 4 (F) -->
  <rect x="460" y="315" width="38" height="58" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Key 5 (G) -->
  <rect x="500" y="315" width="38" height="58" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Key 6 (A) -->
  <rect x="540" y="315" width="38" height="58" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Key 7 (B) -->
  <rect x="580" y="315" width="38" height="58" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Key 8 (C) -->
  <rect x="620" y="315" width="38" height="58" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>

  <!-- Black keys -->
  <!-- C# -->
  <rect x="367" y="315" width="22" height="35" rx="2" fill="#222" stroke="#111" stroke-width="1"/>
  <!-- D# -->
  <rect x="407" y="315" width="22" height="35" rx="2" fill="#222" stroke="#111" stroke-width="1"/>
  <!-- F# -->
  <rect x="487" y="315" width="22" height="35" rx="2" fill="#222" stroke="#111" stroke-width="1"/>
  <!-- G# -->
  <rect x="527" y="315" width="22" height="35" rx="2" fill="#222" stroke="#111" stroke-width="1"/>
  <!-- A# -->
  <rect x="567" y="315" width="22" height="35" rx="2" fill="#222" stroke="#111" stroke-width="1"/>

  <!-- Piano legs -->
  <rect x="350" y="370" width="22" height="80" fill="#2c2118"/>
  <rect x="630" y="370" width="22" height="80" fill="#2c2118"/>

  <!-- Cat body -->
  <ellipse cx="220" cy="310" rx="75" ry="65" fill="#ff9f43"/>
  
  <!-- Cat tail -->
  <path d="M 155 340 Q 100 310 85 250 Q 95 200 140 230" 
        fill="none" stroke="#ff9f43" stroke-width="32" stroke-linecap="round"/>
  <path d="M 155 340 Q 100 310 85 250 Q 95 200 140 230" 
        fill="none" stroke="#e67e22" stroke-width="18" stroke-linecap="round"/>

  <!-- Cat head -->
  <circle cx="175" cy="235" r="48" fill="#ff9f43"/>
  
  <!-- Ears -->
  <!-- Left ear -->
  <polygon points="140,200 125,155 165,205" fill="#ff9f43"/>
  <!-- Right ear -->
  <polygon points="210,200 225,155 185,205" fill="#ff9f43"/>
  
  <!-- Inner ears -->
  <polygon points="145,198 132,168 160,203" fill="#f4a261"/>
  <polygon points="205,198 218,168 190,203" fill="#f4a261"/>

  <!-- Eyes -->
  <ellipse cx="155" cy="225" rx="9" ry="12" fill="#2c3e50"/>
  <ellipse cx="195" cy="225" rx="9" ry="12" fill="#2c3e50"/>
  
  <!-- Eye highlights -->
  <ellipse cx="158" cy="221" rx="3" ry="4" fill="#ffffff"/>
  <ellipse cx="198" cy="221" rx="3" ry="4" fill="#ffffff"/>

  <!-- Nose -->
  <polygon points="175,242 168,250 182,250" fill="#e74c3c"/>
  
  <!-- Mouth -->
  <path d="M 168 252 Q 175 258 182 252" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <!-- Left whiskers -->
  <line x1="140" y1="235" x2="105" y2="225" stroke="#555" stroke-width="1.5"/>
  <line x1="140" y1="240" x2="102" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="140" y1="245" x2="108" y2="255" stroke="#555" stroke-width="1.5"/>
  
  <!-- Right whiskers -->
  <line x1="210" y1="235" x2="245" y2="225" stroke="#555" stroke-width="1.5"/>
  <line x1="210" y1="240" x2="248" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="210" y1="245" x2="242" y2="255" stroke="#555" stroke-width="1.5"/>

  <!-- Front legs / Paws on piano -->
  <!-- Left paw arm -->
  <line x1="245" y1="280" x2="360" y2="330" stroke="#ff9f43" stroke-width="22" stroke-linecap="round"/>
  <!-- Right paw arm -->
  <line x1="255" y1="265" x2="410" y2="325" stroke="#ff9f43" stroke-width="20" stroke-linecap="round"/>

  <!-- Paws -->
  <!-- Left paw -->
  <ellipse cx="365" cy="335" rx="18" ry="12" fill="#ff9f43" transform="rotate(-25 365 335)"/>
  <!-- Right paw -->
  <ellipse cx="415" cy="328" rx="18" ry="12" fill="#ff9f43" transform="rotate(-15 415 328)"/>

  <!-- Paw pads -->
  <ellipse cx="360" cy="338" rx="5" ry="3" fill="#e67e22" transform="rotate(-25 360 338)"/>
  <ellipse cx="410" cy="331" rx="5" ry="3" fill="#e67e22" transform="rotate(-15 410 331)"/>

  <!-- Music notes -->
  <text x="480" y="95" font-size="28" fill="#555" font-family="serif">♪</text>
  <text x="530" y="75" font-size="22" fill="#666" font-family="serif">♫</text>
  <text x="560" y="105" font-size="20" fill="#555" font-family="serif">♪</text>
</svg>
