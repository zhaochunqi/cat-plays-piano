<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="#F0E68C" />

  <!-- Piano -->
  <rect x="50" y="150" width="300" height="100" fill="#D2B48C" />
  <rect x="70" y="160" width="260" height="80" fill="#8B4513" />
  <rect x="70" y="240" width="260" height="80" fill="#8B4513" />
  
  <!-- Cat -->
  <circle cx="150" cy="100" r="50" fill="#808080" />
  <ellipse cx="150" cy="120" rx="20" ry="10" fill="#FFFFFF" />
  <ellipse cx="150" cy="150" rx="15" ry="10" fill="#000000" />
  <path d="M150,170 Q160,190 170,170 Z" fill="#000000" />
  <path d="M150,170 Q140,190 130,170 Z" fill="#000000" />
  <line x1="130" y1="170" x2="130" y2="190" stroke="#000000" stroke-width="2" />
  <line x1="170" y1="170" x2="170" y2="190" stroke="#000000" stroke-width="2" />
  <path d="M150,190 Q160,210 170,190 Z" fill="#000000" />
  <path d="M150,190 Q140,210 130,190 Z" fill="#000000" />
  <path d="M150,210 Q160,230 170,210 Z" fill="#000000" />
  <path d="M150,210 Q140,230 130,210 Z" fill="#000000" />
  
  <!-- Cat's Tail -->
  <polygon points="150,130 160,140 170,130" fill="#808080" />
  
  <!-- Cat's Ears -->
  <polygon points="130,100 140,120 150,100" fill="#808080" />
  <polygon points="170,100 160,120 150,100" fill="#808080" />
</svg>
