<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#e6f2ff" />
  
  <!-- Floor -->
  <rect x="0" y="410" width="500" height="40" fill="#c19a6b" />
  
  <!-- Stool -->
  <rect x="195" y="345" width="12" height="65" fill="#555" />
  <rect x="293" y="345" width="12" height="65" fill="#555" />
  <rect x="180" y="330" width="140" height="15" rx="5" fill="#777" />
  
  <!-- Cat Tail (peeking from behind the piano) -->
  <path d="M 300 350 Q 400 390 450 350 Q 470 320 440 310" stroke="#a9a9a9" stroke-width="14" fill="none" stroke-linecap="round"/>
  
  <!-- Cat Body -->
  <ellipse cx="250" cy="290" rx="55" ry="85" fill="#a9a9a9" />
  
  <!-- Cat Head -->
  <circle cx="250" cy="185" r="45" fill="#a9a9a9" />
  
  <!-- Cat Ears -->
  <polygon points="210,150 205,100 245,130" fill="#a9a9a9" />
  <polygon points="290,150 295,100 255,130" fill="#a9a9a9" />
  <polygon points="215,145 212,115 240,132" fill="#ffb6c1" />
  <polygon points="285,145 288,115 260,132" fill="#ffb6c1" />
  
  <!-- Cat Eyes -->
  <ellipse cx="232" cy="180" rx="6" ry="11" fill="#333" />
  <ellipse cx="268" cy="180" rx="6" ry="11" fill="#333" />
  <circle cx="234" cy="176" r="2" fill="#fff" />
  <circle cx="270" cy="176" r="2" fill="#fff" />
  
  <!-- Cat Nose & Mouth -->
  <polygon points="243,195 257,195 250,203" fill="#ff69b4" />
  <path d="M 250 203 Q 240 213 230 205" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 250 203 Q 260 213 270 205" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Cat Whiskers -->
  <line x1="215" y1="190" x2="150" y2="180" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="215" y1="197" x2="150" y2="202" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="285" y1="190" x2="350" y2="180" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="285" y1="197" x2="350" y2="202" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Piano Upper Panel -->
  <rect x="70" y="80" width="360" height="150" fill="#5c3a21" rx="8" />
  <rect x="70" y="80" width="360" height="10" fill="#703e22" rx="8" />
  <rect x="90" y="100" width="320" height="100" fill="#361f10" rx="4" />
  
  <!-- Sheet Music -->
  <rect x="120" y="115" width="260" height="70" fill="#fdfdfd" rx="3" />
  <g stroke="#bbb" stroke-width="1.5">
    <line x1="120" y1="130" x2="380" y2="130" />
    <line x1="120" y1="142" x2="380" y2="142" />
    <line x1="120" y1="154" x2="380" y2="154" />
    <line x1="120" y1="166" x2="380" y2="166" />
  </g>
  <g stroke="#222" stroke-width="1.5">
    <line x1="154" y1="142" x2="154" y2="122" />
    <line x1="184" y1="130" x2="184" y2="110" />
    <line x1="214" y1="154" x2="214" y2="134" />
    <line x1="254" y1="142" x2="254" y2="122" />
    <line x1="284" y1="166" x2="284" y2="146" />
    <line x1="324" y1="130" x2="324" y2="110" />
    <line x1="354" y1="154" x2="354" y2="134" />
  </g>
  <g fill="#222">
    <circle cx="150" cy="142" r="4" />
    <circle cx="180" cy="130" r="4" />
    <circle cx="210" cy="154" r="4" />
    <circle cx="250" cy="142" r="4" />
    <circle cx="280" cy="166" r="4" />
    <circle cx="320" cy="130" r="4" />
    <circle cx="350" cy="154" r="4" />
  </g>
  
  <!-- Keyboard Ledge -->
  <rect x="60" y="230" width="380" height="15" fill="#361f10" rx="3" />
  <rect x="60" y="242" width="380" height="3" fill="#1a0f08" />
  
  <!-- Piano Keyboard -->
  <rect x="80" y="245" width="340" height="35" fill="#fafafa" stroke="#222" stroke-width="2" rx="2" />
  <g stroke="#666" stroke-width="1.5">
    <line x1="100" y1="245" x2="100" y2="280" />
    <line x1="120" y1="245" x2="120" y2="280" />
    <line x1="140" y1="245" x2="140" y2="280" />
    <line x1="160" y1="245" x2="160" y2="280" />
    <line x1="180" y1="245" x2="180" y2="280" />
    <line x1="200" y1="245" x2="200" y2="280" />
    <line x1="220" y1="245" x2="220" y2="280" />
    <line x1="240" y1="245" x2="240" y2="280" />
    <line x1="260" y1="245" x2="260" y2="280" />
    <line x1="280" y1="245" x2="280" y2="280" />
    <line x1="300" y1="245" x2="300" y2="280" />
    <line x1="320" y1="245" x2="320" y2="280" />
    <line x1="340" y1="245" x2="340" y2="280" />
    <line x1="360" y1="245" x2="360" y2="280" />
    <line x1="380" y1="245" x2="380" y2="280" />
    <line x1="400" y1="245" x2="400" y2="280" />
  </g>
  <g fill="#111">
    <rect x="84" y="245" width="12" height="22" rx="1" />
    <rect x="104" y="245" width="12" height="22" rx="1" />
    <rect x="144" y="245" width="12" height="22" rx="1" />
    <rect x="164" y="245" width="12" height="22" rx="1" />
    <rect x="184" y="245" width="12" height="22" rx="1" />
    <rect x="224" y="245" width="12" height="22" rx="1" />
    <rect x="244" y="245" width="12" height="22" rx="1" />
    <rect x="284" y="245" width="12" height="22" rx="1" />
    <rect x="304" y="245" width="12" height="22" rx="1" />
    <rect x="324" y="245" width="12" height="22" rx="1" />
    <rect x="364" y="245" width="12" height="22" rx="1" />
    <rect x="384" y="245" width="12" height="22" rx="1" />
  </g>
  
  <!-- Piano Front Panel -->
  <rect x="70" y="280" width="360" height="110" fill="#4a2e1b" rx="4" />
  <rect x="70" y="280" width="360" height="8" fill="#5c3a21" rx="4" />
  <rect x="80" y="290" width="340" height="90" fill="#361f10" rx="2" />
  <circle cx="250" cy="335" r="15" fill="#d4af37" />
  <circle cx="250" cy="335" r="10" fill="#4a2e1b" />
  
  <!-- Piano Legs -->
  <rect x="80" y="390" width="25" height="20" fill="#361f10" rx="2" />
  <rect x="395" y="390" width="25" height="20" fill="#361f10" rx="2" />
  
  <!-- Cat Arms and Paws (over the keyboard) -->
  <path d="M 210 280 Q 190 260 200 245" stroke="#a9a9a9" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 290 280 Q 310 260 300 245" stroke="#a9a9a9" stroke-width="18" fill="none" stroke-linecap="round"/>
  <ellipse cx="200" cy="245" rx="14" ry="9" fill="#a9a9a9" />
  <ellipse cx="300" cy="245" rx="14" ry="9" fill="#a9a9a9" />
  <line x1="200" y1="240" x2="200" y2="250" stroke="#888" stroke-width="1"/>
  <line x1="194" y1="242" x2="196" y2="250" stroke="#888" stroke-width="1"/>
  <line x1="206" y1="242" x2="204" y2="250" stroke="#888" stroke-width="1"/>
  <line x1="300" y1="240" x2="300" y2="250" stroke="#888" stroke-width="1"/>
  <line x1="294" y1="242" x2="296" y2="250" stroke="#888" stroke-width="1"/>
  <line x1="306" y1="242" x2="304" y2="250" stroke="#888" stroke-width="1"/>
  
  <!-- Floating Music Notes -->
  <g fill="#555">
    <circle cx="400" cy="60" r="5" />
    <line x1="405" y1="60" x2="405" y2="35" stroke="#555" stroke-width="2" />
    <path d="M 405 35 Q 415 40 410 50" stroke="#555" stroke-width="2" fill="none" />
    
    <circle cx="360" cy="40" r="4" />
    <line x1="364" y1="40" x2="364" y2="20" stroke="#555" stroke-width="1.5" />
    
    <circle cx="80" cy="50" r="4" />
    <line x1="84" y1="50" x2="84" y2="30" stroke="#555" stroke-width="1.5" />
    <path d="M 84 30 Q 94 35 89 45" stroke="#555" stroke-width="1.5" fill="none" />
  </g>
</svg>
