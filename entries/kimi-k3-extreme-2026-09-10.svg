<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E2"/>
      <stop offset="1" stop-color="#F6D7BC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CE9A6E"/>
      <stop offset="1" stop-color="#B67F56"/>
    </linearGradient>
    <linearGradient id="pianoWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E3428"/>
      <stop offset="1" stop-color="#332015"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <g id="note8">
      <ellipse cx="0" cy="0" rx="9" ry="6.5" transform="rotate(-18)"/>
      <rect x="7" y="-40" width="3.6" height="40" rx="1.8"/>
      <path d="M 7 -40 C 20 -36 22 -24 12 -14 C 18 -26 12 -32 7 -33 Z"/>
    </g>
    <g id="note16">
      <ellipse cx="0" cy="0" rx="8.5" ry="6" transform="rotate(-18)"/>
      <ellipse cx="34" cy="-6" rx="8.5" ry="6" transform="rotate(-18 34 -6)"/>
      <rect x="7" y="-38" width="3.4" height="38" rx="1.7"/>
      <rect x="41" y="-44" width="3.4" height="38" rx="1.7"/>
      <path d="M 7 -38 L 44.4 -44 L 44.4 -33 L 7 -27 Z"/>
    </g>
    <g id="sparkle">
      <path d="M 0 -10 L 2.6 -2.6 L 10 0 L 2.6 2.6 L 0 10 L -2.6 2.6 L -10 0 L -2.6 -2.6 Z"/>
    </g>
  </defs>

  <!-- room -->
  <rect width="960" height="640" fill="url(#wall)"/>
  <rect y="498" width="960" height="142" fill="url(#floor)"/>
  <rect y="490" width="960" height="10" fill="#E9C39B"/>
  <rect width="960" height="640" fill="url(#spot)"/>

  <!-- wall picture with paw print -->
  <rect x="64" y="110" width="96" height="76" rx="4" fill="#FFF6E8" stroke="#B5836B" stroke-width="6"/>
  <ellipse cx="112" cy="158" rx="10" ry="8" fill="#C9898B"/>
  <circle cx="100" cy="146" r="3.6" fill="#C9898B"/>
  <circle cx="112" cy="142" r="3.6" fill="#C9898B"/>
  <circle cx="124" cy="146" r="3.6" fill="#C9898B"/>

  <!-- rug -->
  <ellipse cx="470" cy="565" rx="390" ry="52" fill="#E7A9AD" opacity="0.55"/>
  <ellipse cx="470" cy="565" rx="330" ry="40" fill="#F3C6C9" opacity="0.6"/>

  <!-- shadows -->
  <ellipse cx="320" cy="542" rx="220" ry="16" fill="#000000" opacity="0.08"/>
  <ellipse cx="680" cy="546" rx="120" ry="13" fill="#000000" opacity="0.08"/>

  <!-- piano -->
  <g>
    <rect x="120" y="150" width="420" height="24" rx="12" fill="#5C4033"/>
    <rect x="128" y="158" width="404" height="342" rx="20" fill="url(#pianoWood)"/>
    <rect x="150" y="205" width="340" height="95" rx="10" fill="#3A251A" stroke="#5C4033" stroke-width="3"/>
    <rect x="150" y="350" width="300" height="125" rx="10" fill="#3A251A" stroke="#5C4033" stroke-width="3"/>
