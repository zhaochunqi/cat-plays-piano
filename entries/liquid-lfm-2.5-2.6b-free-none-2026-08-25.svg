<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560">
  <!-- Background -->
  <rect width="500" height="560" fill="#fdfbf7"/>

  <!-- Piano body -->
  <rect x="140" y="330" width="320" height="95" fill="#2c3e50" stroke="#1a252f" stroke-width="3"/>
  
  <!-- Piano lid -->
  <rect x="125" y="180" width="300" height="78" fill="#1a252f" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Piano legs -->
  <rect x="155" y="490" width="18" height="72" fill="#4a5568" stroke="#2c3e50" stroke-width="2"/>
  <rect x="265" y="490" width="18" height="72" fill="#4a5568" stroke="#2c3e50" stroke-width="2"/>

  <!-- Piano keys -->
  <g fill="#ececf4" stroke="#2c3e50" stroke-width="1">
    <!-- Row 1 -->
    <rect x="170" y="280" width="7" height="14" />
    <rect x="178" y="280" width="7" height="14" />
    <rect x="186" y="280" width="7" height="14" />
    <rect x="194" y="280" width="7" height="14" />
    <rect x="202" y="280" width="7" height="14" />
    
    <!-- Row 2 -->
    <rect x="160" y="270" width="10" height="16" />
    <rect x="172" y="270" width="10" height="16" />
    <rect x="184" y="270" width="10" height="16" />
    <rect x="196" y="270" width="10" height="16" />
    <rect x="208" y="270" width="10" height="16" />
    
    <!-- Row 3 -->
    <rect x="145" y="260" width="9" height="18" />
    <rect x="157" y="260" width="9" height="18" />
    <rect x="169" y="260" width="9" height="18" />
    <rect x="181" y="260" width="9" height="18" />
    <rect x="193" y="260" width="9" height="18" />
  </g>

  <!-- Cat body -->
  <ellipse cx="245" cy="345" rx="38" ry="32" fill="#a07245"/>

  <!-- Cat head -->
  <circle cx="265" cy="265" r="32" fill="#a07245"/>

  <!-- Ears -->
  <ellipse cx="238" cy="235" rx="13" ry="17" fill="#a07245"/>
  <ellipse cx="288" cy="235" rx="13" ry="17" fill="#a07245"/>
  <ellipse cx="238" cy="233" rx="7" ry="15" fill="#d4b896"/>
  <ellipse cx="288" cy="233" rx="7" ry="15" fill="#d4b896"/>

  <!-- Face -->
  <ellipse cx="265" cy="275" rx="20" ry="18" fill="#f0e6d3"/>

  <!-- Eyes -->
  <circle cx="267" cy="263" r="6" fill="#ffffff"/>
  <circle cx="279" cy="263" r="6" fill="#ffffff"/>
  <circle cx="268" cy="266" r="3" fill="#1a1a1a"/>
  <circle cx="280" cy="266" r="3" fill="#1a1a1a"/>

  <!-- Nose -->
  <ellipse cx="265" cy="289" rx="4" ry="3.5" fill="#d4b896"/>

  <!-- Mouth -->
  <path d="M258 296 Q262 303 266 297" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Left paw (on key) -->
  <circle cx="205" cy="318" r="7" fill="#a07245"/>
  <!-- Right paw (on key) -->
  <circle cx="255" cy="318" r="7" fill="#a07245"/>

  <!-- Tail -->
  <path d="M290 365 Q310 395 305 415" fill="none" stroke="#a07245" stroke-width="11" stroke-linecap="round"/>

  <!-- Musical note decoration -->
  <g transform="translate(460, 440)">
    <path d="M0 0 L10 22 L34 0 L24 -12 Z" fill="#e74c3c" opacity="0.55"/>
    <path d="M0 0 L18 10 L28 0 L22 -8 Z" fill="#3498db" opacity="0.45"/>
  </g>
</svg>
