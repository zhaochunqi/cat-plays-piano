<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f5e6d3"/>
  <rect y="230" width="400" height="70" fill="#c4a484"/>

  <!-- Piano -->
  <rect x="120" y="120" width="180" height="20" rx="4" fill="#3b2b20"/>
  <rect x="120" y="140" width="180" height="90" rx="4" fill="#2c1f18"/>
  <rect x="120" y="140" width="180" height="8" fill="#5a4436"/>
  <!-- White keys -->
  <rect x="130" y="155" width="22" height="75" fill="#fff" stroke="#333" stroke-width="1"/>
  <rect x="152" y="155" width="22" height="75" fill="#fff" stroke="#333" stroke-width="1"/>
  <rect x="174" y="155" width="22" height="75" fill="#fff" stroke="#333" stroke-width="1"/>
  <rect x="196" y="155" width="22" height="75" fill="#fff" stroke="#333" stroke-width="1"/>
  <rect x="218" y="155" width="22" height="75" fill="#fff" stroke="#333" stroke-width="1"/>
  <rect x="240" y="155" width="22" height="75" fill="#fff" stroke="#333" stroke-width="1"/>
  <rect x="262" y="155" width="22" height="75" fill="#fff" stroke="#333" stroke-width="1"/>
  <!-- Black keys -->
  <rect x="147" y="155" width="12" height="42" fill="#111"/>
  <rect x="191" y="155" width="12" height="42" fill="#111"/>
  <rect x="213" y="155" width="12" height="42" fill="#111"/>
  <rect x="257" y="155" width="12" height="42" fill="#111"/>
  <rect x="279" y="155" width="12" height="42" fill="#111"/>

  <!-- Cat Body -->
  <ellipse cx="80" cy="180" rx="45" ry="40" fill="#f4a259"/>
  <!-- Cat Head -->
  <circle cx="70" cy="125" r="28" fill="#f4a259"/>
  <!-- Ears -->
  <polygon points="50,105 58,80 72,100" fill="#f4a259"/>
  <polygon points="60,103 65,88 70,100" fill="#e87f8d"/>
  <polygon points="78,100 92,80 95,105" fill="#f4a259"/>
  <polygon points="80,100 86,88 89,102" fill="#e87f8d"/>
  <!-- Eyes -->
  <circle cx="60" cy="122" r="3" fill="#2c2c2c"/>
  <circle cx="80" cy="122" r="3" fill="#2c2c2c"/>
  <!-- Nose -->
  <polygon points="70,130 66,134 74,134" fill="#e87f8d"/>
  <!-- Whiskers -->
  <line x1="50" y1="130" x2="35" y2="126" stroke="#666" stroke-width="1"/>
  <line x1="50" y1="134" x2="35" y2="138" stroke="#666" stroke-width="1"/>
  <line x1="90" y1="130" x2="105" y2="126" stroke="#666" stroke-width="1"/>
  <line x1="90" y1="134" x2="105" y2="138" stroke="#666" stroke-width="1"/>
  <!-- Tail -->
  <path d="M 120 180 Q 160 140 150 100" stroke="#f4a259" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Arms reaching to keyboard -->
  <line x1="105" y1="165" x2="140" y2="165" stroke="#f4a259" stroke-width="12" stroke-linecap="round"/>
  <line x1="105" y1="175" x2="135" y2="178" stroke="#f4a259" stroke-width="12" stroke-linecap="round"/>
  <!-- Paws on keys -->
  <circle cx="140" cy="165" r="8" fill="#f4a259"/>
  <circle cx="135" cy="178" r="8" fill="#f4a259"/>

  <!-- Musical notes -->
  <text x="180" y="95" font-size="22" fill="#555" font-family="serif">&#9834;</text>
  <text x="220" y="80" font-size="18" fill="#777" font-family="serif">&#9835;</text>
  <text x="260" y="100" font-size="20" fill="#666" font-family="serif">&#9834;</text>
</svg>
