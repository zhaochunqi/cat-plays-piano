<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="400" height="300" fill="#f0f8ff" />

    <!-- Piano -->
    <rect x="50" y="200" width="300" height="80" rx="5" fill="#333" />
    <rect x="60" y="180" width="280" height="20" fill="#f0f0f0" />
    <rect x="70" y="170" width="260" height="10" fill="#ddd" />

    <!-- Piano keys -->
    <g fill="white">
        <rect x="80" y="200" width="15" height="60" />
        <rect x="100" y="200" width="15" height="60" />
        <rect x="120" y="200" width="15" height="60" />
        <rect x="140" y="200" width="15" height="60" />
        <rect x="160" y="200" width="15" height="60" />
        <rect x="180" y="200" width="15" height="60" />
        <rect x="200" y="200" width="15" height="60" />
        <rect x="220" y="200" width="15" height="60" />
        <rect x="240" y="200" width="15" height="60" />
        <rect x="260" y="200" width="15" height="60" />
        <rect x="280" y="200" width="15" height="60" />
    </g>

    <g fill="black">
        <rect x="90" y="200" width="10" height="35" />
        <rect x="110" y="200" width="10" height="35" />
        <rect x="150" y="200" width="10" height="35" />
        <rect x="170" y="200" width="10" height="35" />
        <rect x="210" y="200" width="10" height="35" />
        <rect x="230" y="200" width="10" height="35" />
        <rect x="270" y="200" width="10" height="35" />
    </g>

    <!-- Cat body -->
    <ellipse cx="200" cy="180" rx="60" ry="40" fill="#ffcc88" />

    <!-- Cat head -->
    <circle cx="200" cy="120" r="40" fill="#ffcc88" />

    <!-- Cat ears -->
    <path d="M170,90 L180,60 L190,90 Z" fill="#ffcc88" />
    <path d="M210,90 L220,60 L230,90 Z" fill="#ffcc88" />
    <path d="M172,85 L180,65 L188,85 Z" fill="#ff9966" />
    <path d="M212,85 L220,65 L228,85 Z" fill="#ff9966" />

    <!-- Cat eyes -->
    <circle cx="185" cy="115" r="8" fill="white" />
    <circle cx="215" cy="115" r="8" fill="white" />
    <circle cx="185" cy="115" r="4" fill="#333" />
    <circle cx="215" cy="115" r="4" fill="#333" />
    <circle cx="187" cy="113" r="1.5" fill="white" />
    <circle cx="217" cy="113" r="1.5" fill="white" />

    <!-- Cat nose -->
    <path d="M200,125 L195,130 L205,130 Z" fill="#ff9966" />

    <!-- Cat mouth -->
    <path d="M200,135 Q200,140 195,140 Q200,145 200,145 Q200,145 205,140 Q200,140 200,135" fill="#333" />

    <!-- Cat whiskers -->
    <line x1="170" y1="130" x2="140" y2="125" stroke="#333" stroke-width="1" />
    <line x1="170" y1="135" x2="140" y2="135" stroke="#333" stroke-width="1" />
    <line x1="170" y1="140" x2="140" y2="145" stroke="#333" stroke-width="1" />
    <line x1="230" y1="130" x2="260" y2="125" stroke="#333" stroke-width="1" />
    <line x1="230" y1="135" x2="260" y2="135" stroke="#333" stroke-width="1" />
    <line x1="230" y1="140" x2="260" y2="145" stroke="#333" stroke-width="1" />

    <!-- Cat paws -->
    <ellipse cx="120" cy="220" rx="15" ry="10" fill="#ffcc88" />
    <ellipse cx="280" cy="220" rx="15" ry="10" fill="#ffcc88" />

    <!-- Cat tail -->
    <path d="M260,180 Q290,160 300,190 Q310,220 280,210" fill="none" stroke="#ffcc88" stroke-width="8" stroke-linecap="round" />

    <!-- Music notes -->
    <g fill="#333">
        <circle cx="100" cy="80" r="5" />
        <rect x="98" y="60" width="4" height="20" />
        <path d="M102,60 L106,55" stroke="#333" stroke-width="2" />
        <path d="M102,55 L106,50" stroke="#333" stroke-width="2" />

        <circle cx="130" cy="70" r="5" />
        <rect x="128" y="50" width="4" height="20" />
        <path d="M132,50 L136,45" stroke="#333" stroke-width="2" />
    </g>

    <!-- Cat's playing paws -->
    <ellipse cx="140" cy="210" rx="8" ry="5" fill="#ffcc88" />
    <ellipse cx="160" cy="210" rx="8" ry="5" fill="#ffcc88" />
    <ellipse cx="180" cy="210" rx="8" ry="5" fill="#ffcc88" />
    <ellipse cx="200" cy="210" rx="8" ry="5" fill="#ffcc88" />
    <ellipse cx="220" cy="210" rx="8" ry="5" fill="#ffcc88" />
    <ellipse cx="240" cy="210" rx="8" ry="5" fill="#ffcc88" />

    <!-- Pressed keys (showing the cat is playing) -->
    <rect x="140" y="200" width="15" height="10" fill="#aaddff" />
    <rect x="180" y="200" width="15" height="10" fill="#aaddff" />
    <rect x="220" y="200" width="15" height="10" fill="#aaddff" />
</svg>
