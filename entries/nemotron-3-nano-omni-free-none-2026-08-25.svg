<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <!-- Piano -->
  <rect x="20" y="80" width="160" height="50" fill="#8B4513"/>
  <!-- Keys -->
  <g fill="#FFFFFF">
    <rect x="30" y="85" width="10" height="40"/>
    <rect x="50" y="85" width="10" height="40"/>
    <rect x="70" y="85" width="10" height="40"/>
    <rect x="90" y="85" width="10" height="40"/>
    <rect x="110" y="85" width="10" height="40"/>
    <rect x="130" y="85" width="10" height="40"/>
    <rect x="150" y="85" width="10" height="40"/>
  </g>
  <!-- Cat body -->
  <ellipse cx="100" cy="100" rx="40" ry="20" fill="#F5A9A9"/>
  <!-- Cat head -->
  <circle cx="100" cy="80" r="20" fill="#F5A9A9"/>
  <!-- Ears -->
  <polygon points="85,60 95,55 80,55" fill="#F5A9A9"/>
  <polygon points="115,60 105,55 110,55" fill="#F5A9A9"/>
  <!-- Eyes -->
  <circle cx="90" cy="75" r="3" fill="#000"/>
  <circle cx="110" cy="75" r="3" fill="#000"/>
  <!-- Nose -->
  <circle cx="100" cy="80" r="2" fill="#FF0000"/>
  <!-- Mouth -->
  <path d="M95,82 Q100,85 105,82" stroke="#000" stroke-width="1" fill="none"/>
  <!-- Tail -->
  <path d="M140,100 C150,110 160,100 170,90" stroke="#F5A9A9" stroke-width="4" fill="none"/>
  <!-- Cat paws on keys -->
  <g fill="#F5A9A9">
    <ellipse cx="85" cy="115" rx="6" ry="4"/>
    <ellipse cx="115" cy="115" rx="6" ry="4"/>
  </g>
</svg>
