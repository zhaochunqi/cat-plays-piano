<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Piano body -->
  <rect x="20" y="80" width="260" height="80" rx="10" ry="10" fill="#8B4513" stroke="#5D4037" stroke-width="2"/>
  <!-- Piano keys (white) -->
  <g fill="#FFFFFF" stroke="#000000" stroke-width="1">
    <rect x="30" y="80" width="20" height="60"/>
    <rect x="60" y="80" width="20" height="60"/>
    <rect x="90" y="80" width="20" height="60"/>
    <rect x="120" y="80" width="20" height="60"/>
    <rect x="150" y="80" width="20" height="60"/>
    <rect x="180" y="80" width="20" height="60"/>
    <rect x="210" y="80" width="20" height="60"/>
    <rect x="240" y="80" width="20" height="60"/>
    <rect x="270" y="80" width="20" height="60"/>
  </g>
  <!-- Piano keys (black) -->
  <g fill="#000000">
    <rect x="40" y="80" width="12" height="35"/>
    <rect x="70" y="80" width="12" height="35"/>
    <rect x="100" y="80" width="12" height="35"/>
    <rect x="130" y="80" width="12" height="35"/>
    <rect x="160" y="80" width="12" height="35"/>
    <rect x="190" y="80" width="12" height="35"/>
    <rect x="220" y="80" width="12" height="35"/>
    <rect x="250" y="80" width="12" height="35"/>
  </g>

  <!-- Cat body -->
  <ellipse cx="150" cy="130" rx="40" ry="25" fill="#F5DEB3" stroke="#8B4513" stroke-width="1"/>
  <!-- Cat head -->
  <circle cx="150" cy="90" r="30" fill="#F5DEB3" stroke="#8B4513" stroke-width="1"/>
  <!-- Ears -->
  <polygon points="130,70 120,45 140,55" fill="#F5DEB3" stroke="#8B4513" stroke-width="1"/>
  <polygon points="170,70 180,45 160,55" fill="#F5DEB3" stroke="#8B4513" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="140" cy="85" r="4" fill="#000"/>
  <circle cx="160" cy="85" r="4" fill="#000"/>
  <!-- Nose -->
  <polygon points="150,95 148,100 152,100" fill="#FF8C00"/>
  <!-- Mouth -->
  <path d="M145,105 Q150,110 155,105" stroke="#000" fill="none" stroke-width="1"/>
  <!-- Whiskers -->
  <line x1="130" y1="100" x2="110" y2="95" stroke="#000" stroke-width="0.5"/>
  <line x1="130" y1="105" x2="110" y2="105" stroke="#000" stroke-width="0.5"/>
  <line x1="130" y1="110" x2="110" y2="115" stroke="#000" stroke-width="0.5"/>
  <line x1="170" y1="100" x2="190" y2="95" stroke="#000" stroke-width="0.5"/>
  <line x1="170" y1="105" x2="190" y2="105" stroke="#000" stroke-width="0.5"/>
  <line x1="170" y1="110" x2="190" y2="115" stroke="#000" stroke-width="0.5"/>
  <!-- Front left paw on key -->
  <ellipse cx="115" cy="150" rx="12" ry="6" fill="#D2B48C" stroke="#8B4513" stroke-width="1"/>
  <!-- Front right paw on key -->
  <ellipse cx="185" cy="150" rx="12" ry="6" fill="#D2B48C" stroke="#8B4513" stroke-width="1"/>
  <!-- Tail -->
  <path d="M190,140 Q210,110 230,130 Q250,150 240,180" fill="none" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
</svg>
