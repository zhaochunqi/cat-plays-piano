<svg width="420" height="340"
     viewBox="0 0 420 340"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fdfdfd"/>

  <!-- Piano body -->
  <rect x="60" y="180" width="300" height="80" rx="10" ry="10"
        fill="#8b4513" stroke="#5d3a0a" stroke-width="2"/>

  <!-- White keys -->
  <g fill="#fff" stroke="#000" stroke-width="1">
    <!-- 7 white keys -->
    <rect x="70"  y="180" width="30" height="60"/>
    <rect x="100" y="180" width="30" height="60"/>
    <rect x="130" y="180" width="30" height="60"/>
    <rect x="160" y="180" width="30" height="60"/>
    <rect x="190" y="180" width="30" height="60"/>
    <rect x="220" y="180" width="30" height="60"/>
    <rect x="250" y="180" width="30" height="60"/>
  </g>

  <!-- Black keys (placed on top of white keys) -->
  <g fill="#000">
    <rect x="85"  y="180" width="20" height="40"/>
    <rect x="115" y="180" width="20" height="40"/>
    <rect x="175" y="180" width="20" height="40"/>
    <rect x="205" y="180" width="20" height="40"/>
    <rect x="235" y="180" width="20" height="40"/>
  </g>

  <!-- Cat body -->
  <ellipse cx="210" cy="130" rx="60" ry="40"
           fill="#f5deb3" stroke="#8b4513" stroke-width="1.5"/>

  <!-- Cat head -->
  <circle cx="210" cy="80" r="30"
          fill="#f5deb3" stroke="#8b4513" stroke-width="1.5"/>

  <!-- Ears -->
  <polygon points="190,80 180,50 200,55"
           fill="#f5deb3" stroke="#8b4513" stroke-width="1.5"/>
  <polygon points="230,80 240,50 220,55"
           fill="#f5deb3" stroke="#8b4513" stroke-width="1.5"/>

  <!-- Eyes -->
  <circle cx="200" cy="75" r="4" fill="#000"/>
  <circle cx="220" cy="75" r="4" fill="#000"/>

  <!-- Nose -->
  <polygon points="210,85 205,90 215,90"
           fill="#ffb6c1"/>

  <!-- Mouth (simple curve) -->
  <path d="M200,95 Q210,105 220,95"
        fill="none" stroke="#000" stroke-width="1"/>

  <!-- Whiskers -->
  <line x1рим="190" y1="85" x2="170" y2="80" stroke="#000" stroke-width="0.8"/>
  <line x1="190" y1="90" x2="170" y2="90" stroke="#000" stroke-width="0.8"/>
  <line x1="190" y1="95" x2="170" y2="100" stroke="#000" stroke-width="0.8"/>
  <line x1="230" y1="85" x2="250" y2="80" stroke="#000" stroke-width="0.8"/>
  <line x1="230" y1="90" x2="250" y2="90" stroke="#000" stroke-width="0.8"/>
  <line x1="230" y1="95" x2="250" y2="100" stroke="#000" stroke-width="0.8"/>

  <!-- Front paws (touching the keys) -->
  <ellipse cx="190" cy="140" rx="12" ry="6"
           fill="#f5deb3" stroke="#8b4513" stroke-width="1"/>
  <ellipse cx="230" cy="140" rx="12" ry="6"
           fill="#f5deb3" stroke="#8b4513" stroke-width="1"/>

  <!-- Tail -->
  <path d="M270,130 C300,100 340,120 360,110"
        fill="none" stroke="#f5deb3" stroke-width="8"
        stroke-linecap="round"/>
</svg>
