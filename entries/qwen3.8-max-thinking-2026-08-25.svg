<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A cat playing the piano">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E9"/>
      <stop offset="1" stop-color="#FAE8CE"/>
    </linearGradient>
  </defs>

  <!-- Background & floor -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect y="495" width="800" height="105" fill="#E9D3B0"/>
  <ellipse cx="410" cy="540" rx="345" ry="42" fill="#F7EAD1" stroke="#E0C79E" stroke-width="4"/>

  <!-- Shadows -->
  <ellipse cx="615" cy="521" rx="185" ry="15" fill="#5D402D" opacity="0.13"/>
  <ellipse cx="195" cy="522" rx="125" ry="12" fill="#5D402D" opacity="0.13"/>

  <!-- Piano -->
  <g>
    <rect x="470" y="140" width="290" height="350" rx="6" fill="#7C4A2D"/>
    <rect x="478" y="148" width="8" height="330" rx="4" fill="#FFFFFF" opacity="0.08"/>
    <rect x="458" y="126" width="314" height="20" rx="6" fill="#5D341F"/>
    <rect x="496" y="168" width="238" height="118" rx="6" fill="#8F5636"/>
    <rect x="506" y="178" width="218" height="98" rx="4" fill="none" stroke="#6B3F2A" stroke-width="3"/>

    <!-- Sheet music -->
    <rect x="565" y="210" width="85" height="64" rx="3" fill="#FFFDF5" stroke="#D8D0C0" stroke-width="2"/>
    <g stroke="#A79B85" stroke-width="1.5">
      <line x1="573" y1="224" x2="642" y2="224"/>
      <line x1="573" y1="232" x2="642" y2="232"/>
      <line x1="573" y1="240" x2="642" y2="240"/>
      <line x1="573" y1="248" x2="642" y2="248"/>
      <line x1="573" y1="256" x2="642" y2="256"/>
    </g>
    <g fill="#6B5B4A">
      <circle cx="585" cy="232" r="2.4"/>
      <circle cx="599" cy="240" r="2.4"/>
      <circle cx="613" cy="228" r="2.4"/>
      <circle cx="628" cy="244" r="2.4"/>
    </g>
    <g stroke="#6B5B4A" stroke-width="1.4">
      <line x1="587.4" y1="232" x2="587.4" y2="219"/>
      <line x1="601.4" y1="240" x2="601.4" y2="227"/>
      <line x1="615.4" y1="228" x2="615.4" y2="215"/>
      <line x1="630.4" y1="244" x2="630.4" y2="231"/>
    </g>
    <rect x="558" y="272" width="100" height="10" rx="3" fill="#5D341F"/>

    <!-- Piano legs -->
    <rect x="490" y="488" width="20" height="34" rx="3" fill="#5D341F"/>
    <rect x="724" y="488" width="20" height="34" rx="3" fill="#5D341F"/>
    <rect x="386" y="366" width="18" height="156" rx="3" fill="#5D341F"/>

    <!-- Keyboard -->
    <rect x="372" y="330" width="150" height="38" rx="4" fill="#5D341F"/>
    <rect x="378" y="322" width="132" height="20" fill="#FFFDF5" stroke="#D8D0C0" stroke-width="1.5"/>
    <g stroke="#C9C0AE" stroke-width="1.5">
      <line x1="394.5" y1="323" x2="394.5" y2="341"/>
      <line x1="411"   y1="323" x2="411"   y2="341"/>
      <line x1="427.5" y1="323" x2="427.5" y2="341"/>
      <line x1="444"   y1="323" x2="444"   y2="341"/>
      <line x1="460.5" y1="323" x2="460.5" y2="341"/>
      <line x1="477"   y1="323" x2="477"   y2="341"/>
      <line x1="493.5" y1="323" x2="493.5" y2="341"/>
    </g>
    <g fill="#2B2B2B">
      <rect x="390"   y="322" width="9" height="13" rx="1.5"/>
      <rect x="406.5" y="322" width="9" height="13" rx="1.5"/>
      <rect x="439.5" y="322" width="9" height="13" rx="1.5"/>
      <rect x="456"   y="322" width="9" height="13" rx="1.5"/>
      <rect x="472.5" y="322" width="9" height="13" rx="1.5"/>
    </g>
  </g>

  <!-- Bench -->
  <g>
    <rect x="112" y="432" width="16" height="88" rx="3" fill="#8B4226"/>
    <rect x="262" y="432" width="16" height="88" rx="3" fill="#8B4226"/>
    <rect x="95" y="412" width="200" height="24" rx="9" fill="#A0522D"/>
  </g>

  <!-- Cat -->
  <g>
    <!-- Tail -->
    <path d="M 147 402 C 95 410 70 365 88 325" stroke="#F7A34B" stroke-width="20" stroke-linecap="round" fill="none"/>
    <circle cx="88" cy="325" r="10" fill="#DB7C2A"/>

    <!-- Body -->
    <ellipse cx="205" cy="362" rx="80" ry="62" fill="#F7A34B"/>
    <ellipse cx="160" cy="398" rx="44" ry="34" fill="#EF9437"/>
    <ellipse cx="248" cy="386" rx="26" ry="34" fill="#FFE3BF"/>

    <!-- Ears & head -->
    <path d="M 225 225 L 210 178 L 255 211 Z" fill="#F7A34B"/>
    <path d="M 299 225 L 314 178 L 269 211 Z" fill="#F7A34B"/>
    <circle cx="262" cy="262" r="52" fill="#F7A34B"/>
    <path d="M 220 208 L 214 188 L 236 206 Z" fill="#FFC98A"/>
    <path d="M 304 208 L 310 188 L 288 206 Z" fill="#FFC98A"/>

    <!-- Forehead stripes -->
    <g stroke="#DB7C2A" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M 250 240 Q 247 230 243 223"/>
      <path d="M 263 238 L 263 222"/>
      <path d="M 276 240 Q 279 230 283 223"/>
    </g>

    <!-- Face -->
    <g stroke="#35302B" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 238 258 Q 246 250 254 258"/>
      <path d="M 270 258 Q 278 250 286 258"/>
    </g>
    <ellipse cx="232" cy="276" rx="8" ry="5" fill="#F7B7A3" opacity="0.75"/>
    <ellipse cx="292" cy="276" rx="8" ry="5" fill="#F7B7A3" opacity="0.75"/>
    <path d="M 257 272 L 269 272 L 263 280 Z" fill="#E57373"/>
    <g stroke="#7A4A21" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 263 281 Q 262 288 254 289"/>
      <path d="M 263 281 Q 264 288 272 289"/>
    </g>
    <g stroke="#C98A4B" stroke-width="2.5" stroke-linecap="round">
      <line x1="232" y1="272" x2="206" y2="266"/>
      <line x1="233" y1="280" x2="208" y2="282"/>
      <line x1="292" y1="272" x2="318" y2="266"/>
      <line x1="291" y1="280" x2="316" y2="282"/>
    </g>

    <!-- Collar & bell -->
    <path d="M 234 304 Q 262 334 292 302" stroke="#E2574C" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="263" cy="325" r="7" fill="#F5C542" stroke="#D9A22C" stroke-width="2"/>
    <line x1="263" y1="325" x2="263" y2="330" stroke="#B8860B" stroke-width="1.5"/>

    <!-- Arms reaching to the keys -->
    <path d="M 260 350 C 305 358 350 346 394 341" stroke="#EF9437" stroke-width="22" stroke-linecap="round" fill="none"/>
    <ellipse cx="402" cy="341" rx="16" ry="11" fill="#F7B45F"/>
    <path d="M 255 328 C 300 322 345 318 392 322" stroke="#F7A34B" stroke-width="24" stroke-linecap="round" fill="none"/>
    <ellipse cx="400" cy="323" rx="17" ry="12" fill="#FFC98A"/>
  </g>

  <!-- Key sparkles -->
  <g stroke="#E0A86E" stroke-width="3" stroke-linecap="round">
    <line x1="372" y1="300" x2="366" y2="288"/>
    <line x1="420" y1="298" x2="424" y2="286"/>
  </g>

  <!-- Floating music notes -->
  <g>
    <ellipse cx="355" cy="130" rx="9" ry="6.5" fill="#3E93A6" transform="rotate(-20 355 130)"/>
    <line x1="362.5" y1="127" x2="362.5" y2="90" stroke="#3E93A6" stroke-width="3.5"/>
    <path d="M 362.5 90 C 373 96 375 107 368 114" stroke="#3E93A6" stroke-width="3.5" fill="none"/>

    <ellipse cx="430" cy="98" rx="8" ry="6" fill="#3E93A6" transform="rotate(-18 430 98)"/>
    <ellipse cx="463" cy="88" rx="8" ry="6" fill="#3E93A6" transform="rotate(-18 463 88)"/>
    <line x1="436.5" y1="95" x2="436.5" y2="58" stroke="#3E93A6" stroke-width="3.5"/>
    <line x1="469.5" y1="85" x2="469.5" y2="48" stroke="#3E93A6" stroke-width="3.5"/>
    <path d="M 434.5 60 L 471.5 49 L 471.5 58 L 434.5 69 Z" fill="#3E93A6"/>

    <ellipse cx="300" cy="92" rx="7" ry="5" fill="#E07856" transform="rotate(-18 300 92)"/>
    <line x1="306" y1="89" x2="306" y2="56" stroke="#E07856" stroke-width="3"/>
    <path d="M 306 56 C 315 61 317 71 311 78" stroke="#E07856" stroke-width="3" fill="none"/>

    <ellipse cx="545" cy="92" rx="6.5" ry="5" fill="#3E93A6" transform="rotate(-18 545 92)"/>
    <line x1="550.5" y1="89" x2="550.5" y2="60" stroke="#3E93A6" stroke-width="3"/>
    <path d="M 550.5 60 C 559 65 561 74 555 80" stroke="#3E93A6" stroke-width="3" fill="none"/>
  </g>
</svg>
