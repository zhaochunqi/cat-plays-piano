<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-labelledby="title desc">
  <title id="title">Cat playing piano</title>
  <desc id="desc">A cheerful orange tabby cat sits on a bench and plays an upright piano, with music notes and hearts floating around.</desc>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcecf2"/>
      <stop offset="1" stop-color="#a9c8d4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9714a"/>
      <stop offset="1" stop-color="#7d4f31"/>
    </linearGradient>
    <linearGradient id="piano" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#3a3a48"/>
      <stop offset="0.35" stop-color="#22222c"/>
      <stop offset="1"   stop-color="#14141b"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a5c"/>
      <stop offset="1" stop-color="#1b1b24"/>
    </linearGradient>
    <linearGradient id="keys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#ded7c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Framed sheet music on the wall -->
  <g transform="rotate(-3 128 172)">
    <rect x="58" y="82" width="140" height="180" rx="8" fill="#7a4a2b"/>
    <rect x="68" y="92" width="120" height="160" rx="4" fill="#fdfaf2"/>
    <g stroke="#9aa6b0" stroke-width="2.5" stroke-linecap="round">
      <line x1="80" y1="130" x2="176" y2="130"/>
      <line x1="80" y1="155" x2="176" y2="155"/>
      <line x1="80" y1="180" x2="176" y2="180"/>
      <line x1="80" y1="205" x2="176" y2="205"/>
      <line x1="80" y1="230" x2="176" y2="230"/>
    </g>
    <g fill="#5c6670">
      <ellipse cx="96" cy="142" rx="5" ry="3.6"/><rect x="99" y="114" width="3" height="30"/>
      <ellipse cx="126" cy="150" rx="5" ry="3.6"/><rect x="129" y="122" width="3" height="30"/>
      <ellipse cx="156" cy="138" rx="5" ry="3.6"/><rect x="159" y="110" width="3" height="30"/>
      <ellipse cx="104" cy="196" rx="5" ry="3.6"/><rect x="107" y="168" width="3" height="30"/>
      <ellipse cx="138" cy="188" rx="5" ry="3.6"/><rect x="141" y="160" width="3" height="30"/>
      <ellipse cx="166" cy="200" rx="5" ry="3.6"/><rect x="169" y="172" width="3" height="30"/>
    </g>
  </g>

  <!-- Floor + rug -->
  <rect x="0" y="468" width="800" height="132" fill="url(#floor)"/>
  <rect x="0" y="464" width="800" height="8" fill="#6d4530" opacity="0.6"/>
  <rect x="52" y="472" width="696" height="64" rx="32" fill="#c9603f" opacity="0.28"/>
  <rect x="72" y="484" width="656" height="44" rx="22" fill="none" stroke="#f0d3a8" stroke-width="3" opacity="0.35"/>

  <!-- ===== Piano ===== -->
  <ellipse cx="580" cy="504" rx="212" ry="15" fill="#000" opacity="0.20"/>

  <!-- legs -->
  <rect x="428" y="470" width="24" height="34" rx="4" fill="#1b1b24"/>
  <rect x="704" y="470" width="24" height="34" rx="4" fill="#1b1b24"/>

  <!-- main body -->
  <rect x="420" y="150" width="320" height="332" rx="10" fill="url(#piano)"/>
  <rect x="442" y="176" width="276" height="112" rx="7" fill="#262633"/>
  <rect x="452" y="186" width="256" height="92" rx="5" fill="none" stroke="#c9a227" stroke-width="2.5" opacity="0.75"/>
  <!-- gold flourish -->
  <g stroke="#e3c05a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M556 252 C556 224 592 224 592 244 C 592 262 566 258 566 238"/>
    <path d="M556 252 C 556 280 520 280 520 260 C 520 242 546 246 546 266"/>
  </g>

  <!-- top lid -->
  <rect x="404" y="126" width="352" height="26" rx="9" fill="url(#lid)"/>
  <rect x="416" y="132" width="328" height="6" rx="3" fill="#8e8ea6" opacity="0.35"/>

  <!-- key shelf (top board) -->
  <rect x="400" y="384" width="56" height="16" rx="4" fill="#1b1b24"/>

  <!-- white keys -->
  <g fill="url(#keys)">
    <rect x="320" y="398" width="21" height="38" rx="2"/>
    <rect x="342" y="398" width="21" height="38" rx="2"/>
    <rect x="364" y="398" width="21" height="38" rx="2"/>
    <rect x="386" y="398" width="21" height="38" rx="2"/>
    <rect x="408" y="398" width="21" height="38" rx="2"/>
  </g>
  <!-- pressed-key shading under the paws -->
  <rect x="342" y="398" width="21" height="38" fill="#000" opacity="0.10"/>
  <rect x="386" y="398" width="21" height="38" fill="#000" opacity="0.10"/>
  <!-- black keys -->
  <g fill="#16161e">
    <rect x="331" y="398" width="13" height="23" rx="2"/>
    <rect x="353" y="398" width="13" height="23" rx="2"/>
    <rect x="397" y="398" width="13" height="23" rx="2"/>
    <rect x="419" y="398" width="11" height="23" rx="2"/>
  </g>
  <!-- key shelf (bottom board) -->
  <rect x="314" y="436" width="118" height="11" rx="4" fill="#1b1b24"/>

  <!-- apron + pedal box -->
  <rect x="418" y="447" width="324" height="30" fill="#1b1b24"/>
  <rect x="486" y="474" width="94" height="30" rx="6" fill="#23232d"/>
  <rect x="506" y="482" width="12" height="18" rx="5" fill="#e3c05a"/>
  <rect x="544" y="482" width="12" height="18" rx="5" fill="#e3c05a"/>

  <!-- ===== Bench ===== -->
  <ellipse cx="240" cy="502" rx="152" ry="13" fill="#000" opacity="0.20"/>
  <rect x="108" y="426" width="264" height="20" rx="8" fill="#8a5430"/>
  <rect x="108" y="430" width="264" height="6" rx="3" fill="#b0703f" opacity="0.8"/>
  <rect x="124" y="446" width="17" height="56" rx="5" fill="#6d4324"/>
  <rect x="336" y="446" width="17" height="56" rx="5" fill="#6d4324"/>

  <!-- ===== Cat ===== -->
  <ellipse cx="264" cy="430" rx="82" ry="14" fill="#000" opacity="0.18"/>

  <!-- tail (draped over the bench) -->
  <path d="M198424 C 150 430 126 392 146 360 C 160 338 190 348 182 370"
        fill="none" stroke="#dd8b3f" stroke-width="24" stroke-linecap="round"/>
  <path d="M198 424 C 150 430 126 392 146 360" fill="none"
        stroke="#f0a855" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- body -->
  <path d="M194 430 C 188 366 202 306 240 274 C 263 253 303 254 322 282
           C 342 312 338 376 334 430 Z" fill="#eda45a"/>
  <!-- belly shading -->
  <path d="M258 430 C 250 372 258 320 282 292 C 300 272 320 282 326 306
           C 334 344 332 396 332 430 Z" fill="#f8c98c" opacity="0.75"/>
  <!-- tabby stripes -->
  <g fill="none" stroke="#d1813a" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <path d="M212 336 C 232 330 250 336 262 350"/>
    <path d="M206 374 C 228 368 250 374 266 388"/>
    <path d="M203 408 C 226 402 250 408 268 420"/>
  </g>

  <!-- far arm -->
  <path d="M300 302 C 328 330 348 368 370 394" fill="none"
        stroke="#dd8b3f" stroke-width="27" stroke-linecap="round"/>
  <g transform="rotate(-28 374 400)">
    <ellipse cx="374" cy="400" rx="19" ry="13" fill="#ffe2c2"/>
    <g stroke="#d8a071" stroke-width="1.8" stroke-linecap="round">
      <line x1="370" y1="392" x2="370" y2="400"/>
      <line x1="377" y1="392" x2="377" y2="400"/>
    </g>
  </g>

  <!-- near arm -->
  <path d="M318 332 C 352 362 374 394 398 412" fill="none"
        stroke="#f2ab5c" stroke-width="30" stroke-linecap="round"/>
  <path d="M318 332 C 344 356 360 378 372 392" fill="none"
        stroke="#ffd39a" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  <g transform="rotate(-22 404 414)">
    <ellipse cx="404" cy="414" rx="21" ry="14" fill="#fff0d8"/>
    <g stroke="#e0ab7c" stroke-width="2" stroke-linecap="round">
      <line x1="399" y1="405" x2="399" y2="414"/>
      <line x1="407" y1="405" x2="407" y2="414"/>
      <line x1="414" y1="406" x2="414" y2="414"/>
    </g>
  </g>

  <!-- ears -->
  <path d="M214 182 L 208 122 L 264 158 Z" fill="#eda45a"/>
  <path d="M320 158 L 372 124 L 362 186 Z" fill="#eda45a"/>
  <path d="M224 176 L 220 140 L 256 162 Z" fill="#f2a2a8"/>
  <path d="M330 162 L 360 142 L 354 180 Z" fill="#f2a2a8"/>

  <!-- head -->
  <circle cx="272" cy="216" r="63" fill="#f2ab5c"/>
  <path d="M228 178 C 250 166 296 166 318 180" fill="none"
        stroke="#d1813a" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <g fill="#d1813a" opacity="0.8">
    <path d="M246 146 L 252 166 L 236 156 Z"/>
    <path d="M272 140 L 276 162 L 262 156 Z"/>
    <path d="M298 146 L 296 168 L 310 158 Z"/>
  </g>

  <!-- muzzle -->
  <ellipse cx="272" cy="240" rx="34" ry="22" fill="#ffe6c9"/>
  <ellipse cx="272" cy="252" rx="20" ry="12" fill="#fff4e4"/>

  <!-- eyes -->
  <ellipse cx="248" cy="212" rx="11" ry="12.5" fill="#2b2b36"/>
  <ellipse cx="296" cy="212" rx="11" ry="12.5" fill="#2b2b36"/>
  <circle cx="244" cy="207" r="4" fill="#fff"/>
  <circle cx="292" cy="207" r="4" fill="#fff"/>
  <circle cx="252" cy="218" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="300" cy="218" r="2" fill="#fff" opacity="0.6"/>

  <!-- nose + mouth -->
  <path d="M264 228 L 280 228 L 272 239 Z" fill="#e07a8a"/>
  <path d="M272 239 v 7" stroke="#b9765a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M272 246 q -10 9 -18 3" stroke="#b9765a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M272 246 q 10 9 18 3" stroke="#b9765a" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- whiskers -->
  <g stroke="#fdf0dc" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
    <line x1="248" y1="234" x2="192" y2="222"/>
    <line x1="247" y1="242" x2="188" y2="244"/>
    <line x1="249" y1="250" x2="196" y2="264"/>
    <line x1="296" y1="234" x2="352" y2="222"/>
    <line x1="297" y1="242" x2="356" y2="244"/>
    <line x1="295" y1="250" x2="348" y2="264"/>
  </g>

  <!-- ===== Floating music ===== -->
  <g fill="#3f5f7a" opacity="0.85">
    <g transform="translate(150 168) scale(1.25)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-200 0)"/>
      <rect x="7" y="-36" width="4" height="38" rx="2"/>
      <path d="M11 -36 C 24 -30 26 -20 22 -12 C 20 -22 14 -26 11 -27 Z"/>
    </g>
    <g transform="translate(100 286) scale(0.85)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-20 0 0)"/>
      <rect x="7" y="-32" width="4" height="34" rx="2"/>
      <path d="M11 -32 C 22 -27 24 -18 20 -11 C 18 -20 13 -23 11 -24 Z"/>
    </g>
    <g transform="translate(392 108) scale(0.95)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-20 0 0)"/>
      <rect x="7" y="-34" width="4" height="36" rx="2"/>
      <path d="M11 -34 C 23 -29 25 -19 21 -12 C 19 -21 14 -25 11 -26 Z"/>
    </g>
    <g transform="translate(600 76) scale(1.1)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-20 0 0)"/>
      <rect x="7" y="-36" width="4" height="38" rx="2"/>
      <path d="M11 -36 C 24 -30 26 -20 22 -12 C 20 -22 14 -26 11 -27 Z"/>
    </g>
    <g transform="translate(686 196) scale(0.7)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-20 0 0)"/>
      <rect x="7" y="-30" width="4" height="32" rx="2"/>
    </g>
  </g>

  <!-- hearts -->
  <g fill="#e8737f" opacity="0.8">
    <path d="M376 200 C 366 190 358 200 366 208 L 376 218 L 386 208 C 394 200 386 190 376 200 Z"
          transform="translate(0 -18) scale(0.75)"/>
    <path d="M398 262 C 390 254 384 262 390 268 L 398 276 L 406 268 C 412 262 406 254 398 262 Z"
          transform="translate(0 -18) scale(0.55)"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff6d0" opacity="0.9">
    <path d="M340 96 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 Z"/>
    <path d="M470 200 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 Z"/>
    <path d="M180 60 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z"/>
  </g>
</svg>
