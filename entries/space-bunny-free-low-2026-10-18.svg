<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2140"/>
      <stop offset="100%" stop-color="#4a3a63"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2b"/>
      <stop offset="100%" stop-color="#5d3a19"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a860"/>
      <stop offset="100%" stop-color="#d1813f"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>

  <!-- floor -->
  <rect y="400" width="640" height="80" fill="#3a2d50"/>
  <ellipse cx="320" cy="412" rx="240" ry="18" fill="#241b36"/>

  <!-- music notes -->
  <g fill="#f7e7a1" opacity="0.85" font-family="serif" font-size="30">
    <text x="90" y="120">&#9834;</text>
    <text x="500" y="90" font-size="38">&#9835;</text>
    <text x="160" y="70" font-size="24">&#9834;</text>
    <text x="440" y="170" font-size="22">&#9834;</text>
  </g>

  <!-- bench -->
  <rect x="200" y="352" width="180" height="14" rx="5" fill="#6b4322"/>
  <rect x="215" y="366" width="12" height="48" fill="#5d3a19"/>
  <rect x="353" y="366" width="12" height="48" fill="#5d3a19"/>

  <!-- cat body -->
  <g>
    <!-- tail -->
    <path d="M395 320 q60 -10 55 -60 q-3 -30 -28 -26 q-18 4 -14 22"
          fill="none" stroke="url(#fur)" stroke-width="16" stroke-linecap="round"/>
    <!-- torso -->
    <ellipse cx="320" cy="268" rx="70" ry="62" fill="url(#fur)"/>
    <!-- stripes -->
    <g stroke="#b96c30" stroke-width="7" stroke-linecap="round" opacity="0.8">
      <path d="M290 214 q6 16 2 30"/>
      <path d="M318 208 q6 18 2 34"/>
      <path d="M346 214 q6 16 2 30"/>
    </g>
    <!-- head -->
    <circle cx="322" cy="168" r="52" fill="url(#fur)"/>
    <!-- ears -->
    <path d="M282 130 l-12 -44 l40 22 z" fill="url(#fur)"/>
    <path d="M362 130 l12 -44 l-40 22 z" fill="url(#fur)"/>
    <path d="M285 128 l-7 -28 l24 13 z" fill="#f3b3b3"/>
    <path d="M359 128 l7 -28 l-24 13 z" fill="#f3b3b3"/>
    <!-- face -->
    <g fill="#2f2a33">
      <ellipse cx="304" cy="166" rx="6" ry="9"/>
      <ellipse cx="342" cy="166" rx="6" ry="9"/>
    </g>
    <path d="M320 180 l66 l6 -6" fill="none" stroke="#2f2a33" stroke-width="4" stroke-linecap="round"/>
    <path d="M312 190 q8 8 16 0" fill="none" stroke="#2f2a33" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#2f2a33" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M300 186 l-34 -6"/><path d="M300 194 l-32 6"/>
      <path d="M344 186 l34 -6"/><path d="M344 194 l32 6"/>
    </g>
    <!-- whiskers -->
    <g stroke="#fff5e0" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <path d="M300 184 l-42 -10"/><path d="M300 194 l-42 6"/>
      <path d="M344 184 l42 -10"/><path d="M344 194 l42 6"/>
    </g>
    <!-- front legs reaching keys -->
    <g stroke="url(#fur)" stroke-width="20" stroke-linecap="round">
      <path d="M300 300 q-16 22 -34 34"/>
      <path d="M346 300 q18 20 34 30"/>
    </g>
  </g>

  <!-- piano -->
  <g>
    <!-- legs -->
    <rect x="90" y="392" width="18" height="24" fill="#3d2712"/>
    <rect x="492" y="392" width="18" height="24" fill="#3d2712"/>
    <!-- body -->
    <path d="M70 300 h460 q20 0 20 18 v34 q0 18 -20 18 H70 q-20 0 -20 -18 v-34 q0 -18 20 -18 z"
          fill="url(#wood)"/>
    <rect x="58" y="318" width="504" height="10" fill="#402812" opacity="0.6"/>
    <!-- fallboard highlight -->
    <rect x="60" y="304" width="500" height="6" rx="3" fill="#a9724a" opacity="0.7"/>
    <!-- white keys -->
    <g fill="#fdfaf3">
      <rect x="70" y="332" width="490" height="38" rx="4"/>
    </g>
    <g stroke="#c9c2b4" stroke-width="2">
      <line x1="70"  y1="332" x2="70"  y2="370"/>
      <line x1="111" y1="332" x2="111" y2="370"/>
      <line x1="152" y1="332" x2="152" y2="370"/>
      <line x1="193" y1="332" x2="193" y2="370"/>
      <line x1="233" y1="332" x2="233" y2="370"/>
      <line x1="274" y1="332" x2="274" y2="370"/>
      <line x1="315" y1="332" x2="315" y2="370"/>
      <line x1="356" y1="332" x2="356" y2="370"/>
      <line x1="396" y1="332" x2="396" y2="370"/>
      <line x1="437" y1="332" x2="437" y2="370"/>
      <line x1="478" y1="332" x2="478" y2="370"/>
      <line x1="519" y1="332" x2="519" y2="370"/>
      <line x1="560" y1="332" x2="560" y2="370"/>
    </g>
    <!-- black keys -->
    <g fill="#20191c">
      <rect x="99"  y="332" width="24" height="24" rx="2"/>
      <rect x="140" y="332" width="24" height="24" rx="2"/>
      <rect x="181" y="332" width="24" height="24" rx="2"/>
      <rect x="263" y="332" width="24" height="24" rx="2"/>
      <rect x="304" y="332" width="24" height="24" rx="2"/>
      <rect x="345" y="332" width="24" height="24" rx="2"/>
      <rect x="427" y="332" width="24" height="24" rx="2"/>
      <rect x="468" y="332" width="24" height="24" rx="2"/>
      <rect x="509" y="332" width="24" height="24" rx="2"/>
    </g>
    <!-- paws on keys -->
    <ellipse cx="288" cy="368" rx="14" ry="9" fill="#f7c58a"/>
    <ellipse cx="378" cy="368" rx="14" ry="9" fill="#f7c58a"/>
    <!-- sheet music -->
    <rect x="404" y="252" width="72" height="52" rx="3" fill="#f7f2e2" transform="rotate(8 440 278)"/>
    <g stroke="#8b8375" stroke-width="2">
      <line x1="412" y1="268" x2="468" y2="272"/>
      <line x1="412" y1="278" x2="468" y2="282"/>
      <line x1="412" y1="288" x2="468" y2="292"/>
    </g>
    <circle cx="470" cy="266" r="4" fill="none" stroke="#5d3a19" stroke-width="3"/>
  </g>
</svg>
