<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620"
     role="img" aria-labelledby="title desc">
  <title id="title">A cat playing the piano</title>
  <desc id="desc">A cheerful ginger cat stands behind an upright piano, paws on the keys,
  tail curled around the side, with musical notes floating up through a warm room.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f1d9b6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c99c"/>
      <stop offset="1" stop-color="#d3a274"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff4d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3626"/>
      <stop offset="0.45" stop-color="#6d422e"/>
      <stop offset="1" stop-color="#482a1d"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d4e37"/>
      <stop offset="1" stop-color="#5c3626"/>
    </linearGradient>
    <linearGradient id="keys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#efe3cd"/>
    </linearGradient>
    <linearGradient id="cat" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f7b263"/>
      <stop offset="1" stop-color="#ea9440"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d488"/>
      <stop offset="1" stop-color="#b98f36"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5b3a22" flood-opacity="0.28"/>
    </filter>

    <!-- reusable music notes -->
    <g id="note">
      <ellipse cx="0" cy="0" rx="8" ry="6" transform="rotate(-20)"/>
      <path d="M7 -5 L7 -40" fill="none" stroke-width="3.6"/>
      <path d="M7 -40 C 20 -36 22 -24 11 -21" fill="none" stroke-width="3.6"/>
    </g>
    <g id="pair">
      <ellipse cx="0" cy="0" rx="8" ry="6" transform="rotate(-20)"/>
      <path d="M7 -5 L7 -46" fill="none" stroke-width="3.6"/>
      <ellipse cx="30" cy="9" rx="8" ry="6" transform="rotate(-20)"/>
      <path d="M37 4 L37 -37" fill="none" stroke-width="3.6"/>
      <path d="M7 -46 L37 -37" fill="none" stroke-width="5.5"/>
    </g>
    <path id="spark" d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z"/>
  </defs>

  <!-- ============ room ============ -->
  <rect width="800" height="620" fill="url(#bg)"/>
  <ellipse cx="440" cy="270" rx="330" ry="250" fill="url(#glow)"/>
  <rect y="555" width="800" height="65" fill="url(#floor)"/>
  <rect y="543" width="800" height="14" fill="#fff7ea" opacity="0.9"/>

  <!-- framed picture on the wall -->
  <g>
    <rect x="60" y="132" width="100" height="120" rx="7" fill="#8a5a3b"/>
    <rect x="68" y="140" width="84" height="104" rx="4" fill="#fdf4e4"/>
    <g transform="translate(110212) scale(1.3)" fill="#b6603f" stroke="#b6603f" stroke-linecap="round">
      <use href="#note"/>
    </g>
  </g>

  <!-- rug -->
  <ellipse cx="440" cy="588" rx="318" ry="34" fill="#bf6a58"/>
  <ellipse cx="440" cy="588" rx="268" ry="26" fill="#d78a6f"/>
  <ellipse cx="440" cy="588" rx="268" ry="26" fill="none" stroke="#f3d3b6" stroke-width="3" stroke-dasharray="10 12"/>

  <!-- ============ piano ============ -->
  <g filter="url(#soft)">
    <!-- legs + pedals -->
    <rect x="262" y="500" width="28" height="68" rx="4" fill="#4a2b1e"/>
    <rect x="588" y="500" width="28" height="68" rx="4" fill="#4a2b1e"/>
    <rect x="414" y="500" width="14" height="26" rx="3" fill="url(#gold)"/>
    <rect x="448" y="500" width="14" height="26" rx="3" fill="url(#gold)"/>
    <!-- apron -->
    <rect x="252" y="478" width="374" height="28" rx="5" fill="#5a3626"/>
    <!-- body -->
    <rect x="242" y="206" width="392" height="222" rx="9" fill="url(#wood)"/>
<rect x="266" y="226" width="344" height="94" rx="7" fill="none" stroke="#7d4e37" stroke-width="4" opacity="0.7"/>
    <rect x="266" y="332" width="344" height="82" rx="7" fill="none" stroke="#7d4e37" stroke-width="4" opacity="0.7"/>
    <rect x="292" y="348" width="292" height="52" rx="5" fill="#3d241a" opacity="0.55"/>
    <!-- lid -->
    <rect x="228" y="192" width="420" height="18" rx="7" fill="url(#lid)"/>
    <rect x="228" y="192" width="420" height="6" rx="3" fill="#96603f" opacity="0.65"/>
  </g>

  <!-- ============ cat (behind the keys) ============ -->
  <!-- tail -->
  <g>
    <path d="M518 448 C 604 468 692 424 686 352 C 682 300 628 292 616 332"
          fill="none" stroke="#ea9440" stroke-width="24" stroke-linecap="round"/>
    <path d="M518 448 C 604 468 692 424 686 352 C 682 300 628 292 616 332"
          fill="none" stroke="#cf7526" stroke-width="24" stroke-linecap="butt" stroke-dasharray="16 26" opacity="0.85"/>
    <path d="M616 332 C 622 314 640 314 648 326"
          fill="none" stroke="#cf7526" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- body -->
  <path d="M445 202 C 398 208 354 250 352 330
           C 350 392 360 442 372 472
           L 520 472
           C 532 442 542 392 540 330
           C 538 250 492 202 445 202 Z"
        fill="url(#cat)" stroke="#c9711f" stroke-width="4" stroke-linejoin="round"/>
  <!-- chest fluff -->
  <path d="M415 262 C 400 320 402 400 414 470 L 476 470 C 488 400 490 320 475 262 Z"
        fill="#fde3bb" opacity="0.95"/>
  <!-- stripes on body -->
  <g stroke="#cf7526" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M356 288 C 372 300 384 304 396 302"/>
    <path d="M534 288 C 518 300 506 304 494 302"/>
    <path d="M357 352 C 374 364 388 368 400 366"/>
    <path d="M533 352 C 516 364 502 368 490 366"/>
  </g>

  <!-- arms -->
  <g fill="none" stroke-linecap="round">
    <path d="M382 258 C 358 320 374 400 408 436" stroke="#ee9c47" stroke-width="28"/>
    <path d="M382 258 C 358 320 374 400 408 436" stroke="#cf7526" stroke-width="28" stroke-dasharray="18 30" opacity="0.75"/>
    <path d="M510 258 C 534 320 518 400 486 436" stroke="#ee9c47" stroke-width="28"/>
    <path d="M510 258 C 534 320 518 400 486 436" stroke="#cf7526" stroke-width="28" stroke-dasharray="18 30" opacity="0.75"/>
  </g>

  <!-- head -->
  <g>
    <!-- ears -->
    <path d="M392 134 L 376 76 L 428 106 Z" fill="#ee9c47" stroke="#c9711f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M398 128 L 388 92 L 419 110 Z" fill="#f7a3ae"/>
    <path d="M498 134 L 514 76 L 462 106 Z" fill="#ee9c47" stroke="#c9711f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M492 128 L 502 92 L 471 110 Z" fill="#f7a3ae"/>
    <!-- face -->
    <path d="M445 96
             C 490 96 516 124 516 160
             C 516 194 488 218 445 218
             C 402 218 374 194 374 160
             C 374 124 400 96 445 96 Z"
          fill="url(#cat)" stroke="#c9711f" stroke-width="4" stroke-linejoin="round"/>
    <!-- forehead stripes -->
    <g stroke="#cf7526" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M420 110 L 428 132"/>
      <path d="M445 104 L 445 130"/>
      <path d="M470 110 L 462 132"/>
    </g>
    <!-- cheeks -->
    <ellipse cx="392" cy="176" rx="12" ry="8" fill="#ff9c9c" opacity="0.4"/>
    <ellipse cx="498" cy="176" rx="12" ry="8" fill="#ff9c9c" opacity="0.4"/>
    <!-- eyes -->
    <g>
      <ellipse cx="413" cy="152" rx="13.5" ry="15.5" fill="#f7efe2" stroke="#c9711f" stroke-width="2.5"/>
      <ellipse cx="414" cy="153" rx="6" ry="12.5" fill="#33291f"/>
      <circle cx="410.5" cy="147" r="3.6" fill="#fff"/>
      <circle cx="417.5" cy="160" r="1.7" fill="#fff" opacity="0.85"/>
      <ellipse cx="477" cy="152" rx="13.5" ry="15.5" fill="#f7efe2" stroke="#c9711f" stroke-width="2.5"/>
      <ellipse cx="476" cy="153" rx="6" ry="12.5" fill="#33291f"/>
      <circle cx="472.5" cy="147" r="3.6" fill="#fff"/>
      <circle cx="479.5" cy="160" r="1.7" fill="#fff" opacity="0.85"/>
    </g>
    <!-- muzzle + nose + mouth -->
    <ellipse cx="431" cy="184" rx="15" ry="11" fill="#fdeccd"/>
    <ellipse cx="459" cy="184" rx="15" ry="11" fill="#fdeccd"/>
    <path d="M436 176 Q 445 170 454 176 Q 451 187 445 187 Q 439 187 436 176 Z" fill="#f2789f"/>
    <g stroke="#a35c33" stroke-width="2.8" stroke-linecap="round" fill="none">
      <path d="M445 187 L 445 192"/>
      <path d="M445 192 Q 437 200 430 193"/>
      <path d="M445 192 Q 453 200 460 193"/>
    </g>
    <!-- whiskers -->
    <g stroke="#fff6e6" stroke-width="2.2" stroke-linecap="round" opacity="0.95">
      <path d="M424 180 L 378 170"/><path d="M424 188 L 380 190"/><path d="M426 195 L 386 205"/>
      <path d="M466 180 L 512 170"/><path d="M466 188 L 510 190"/><path d="M464 195 L 504 205"/>
    </g>
  </g>

  <!-- ============ keyboard (drawn over cat's lower body) ============ -->
  <g>
    <!-- ledge -->
    <rect x="232" y="418" width="412" height="16" rx="5" fill="#6d422e"/>
    <rect x="232" y="418" width="412" height="5" rx="2.5" fill="#8a583c" opacity="0.7"/>
    <!-- key bed -->
    <rect x="252" y="432" width="372" height="52" rx="5" fill="#2a1a13"/>
    <!-- white keys -->
    <g fill="url(#keys)" stroke="#d9c8ab" stroke-width="1.6">
      <rect x="262" y="434" width="25" height="46" rx="2"/>
      <rect x="287" y="434" width="25" height="46"/>
      <rect x="312" y="434" width="25" height="46"/>
      <rect x="337" y="434" width="25" height="46"/>
      <rect x="362" y="434" width="25" height="46"/>
      <rect x="387" y="434" width="25" height="46"/>
      <rect x="412" y="434" width="25" height="46"/>
      <rect x="437" y="434" width="25" height="46"/>
      <rect x="462" y="434" width="25" height="46"/>
      <rect x="487" y="434" width="25" height="46"/>
      <rect x="512" y="434" width="25" height="46"/>
      <rect x="537" y="434" width="25" height="46"/>
      <rect x="562" y="434" width="25" height="46"/>
      <rect x="587" y="434" width="25" height="46" rx="2"/>
    </g>
    <!-- black keys -->
    <g fill="#1d1512">
      <rect x="279.5" y="434" width="15" height="28" rx="2"/>
      <rect x="304.5" y="434" width="15" height="28" rx="2"/>
      <rect x="354.5" y="434" width="15" height="28" rx="2"/>
      <rect x="379.5" y="434" width="15" height="28" rx="2"/>
      <rect x="404.5" y="434" width="15" height="28" rx="2"/>
      <rect x="454.5" y="434" width="15" height="28" rx="2"/>
      <rect x="479.5" y="434" width="15" height="28" rx="2"/>
      <rect x="529.5" y="434" width="15" height="28" rx="2"/>
      <rect x="554.5" y="434" width="15" height="28" rx="2"/>
      <rect x="579.5" y="434" width="15" height="28" rx="2"/>
    </g>
    <g fill="#fff" opacity="0.14">
      <rect x="281.5" y="436" width="11" height="3" rx="1.5"/>
      <rect x="406.5" y="436" width="11" height="3" rx="1.5"/>
      <rect x="531.5" y="436" width="11" height="3" rx="1.5"/>
    </g>
  </g>

  <!-- ============ paws on the keys ============ -->
  <g>
    <ellipse cx="408" cy="470" rx="24" ry="7" fill="#6d422e" opacity="0.35"/>
    <ellipse cx="484" cy="470" rx="24" ry="7" fill="#6d422e" opacity="0.35"/>
    <path d="M384 456 C 384 440 396 432 408 432 C 420 432 432 440 432 456 Z"
          fill="#f6c78b" stroke="#c9711f" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M460 456 C 460 440 472 432 484 432 C 496 432 508 440 508 456 Z"
          fill="#f6c78b" stroke="#c9711f" stroke-width="3.4" stroke-linejoin="round"/>
    <g stroke="#c9711f" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M400 441 L 400 452"/><path d="M416 441 L 416 452"/>
      <path d="M476 441 L 476 452"/><path d="M492 441 L 492 452"/>
    </g>
  </g>

  <!-- ============ floating music ============ -->
  <g stroke-linecap="round">
    <g transform="translate(196 168) rotate(-12) scale(1.25)" fill="#4a6590" stroke="#4a6590">
      <use href="#note"/>
    </g>
    <g transform="translate(268 82) rotate(10) scale(0.95)" fill="#c2705f" stroke="#c2705f">
      <use href="#note"/>
    </g>
    <g transform="translate(596 122) rotate(-14) scale(1.15)" fill="#4a6590" stroke="#4a6590">
      <use href="#note"/>
    </g>
    <g transform="translate(676 232) rotate(12) scale(0.9)" fill="#c2705f" stroke="#c2705f">
      <use href="#note"/>
    </g>
    <g transform="translate(120 330) rotate(-16) scale(1.05)" fill="#4a6590" stroke="#4a6590">
      <use href="#note"/>
    </g>
    <g transform="translate(716 400) rotate(-8) scale(1.15)" fill="#4a6590" stroke="#4a6590">
      <use href="#note"/>
    </g>
    <g transform="translate(544 54) rotate(6) scale(1.05)" fill="#3f5a82" stroke="#3f5a82">
      <use href="#pair"/>
    </g>
    <g transform="translate(160 452) rotate(-6) scale(0.85)" fill="#3f5a82" stroke="#3f5a82">
      <use href="#pair"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#e8b martial" opacity="0"></g>
  <g fill="#e9b64d" opacity="0.9">
    <use href="#spark" transform="translate(340 96) scale(0.9)"/>
    <use href="#spark" transform="translate(520 250) scale(0.7)"/>
    <use href="#spark" transform="translate(236 300) scale(0.6)"/>
    <use href="#spark" transform="translate(648 470) scale(0.8)"/>
    <use href="#spark" transform="translate(112 236) scale(0.55)"/>
  </g>
</svg>
