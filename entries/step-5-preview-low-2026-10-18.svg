<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#FFF8E1"/>

  <!-- Piano top/back -->
  <rect x="40" y="270" width="280" height="35" rx="3" fill="#6D4C41"/>
  <rect x="40" y="305" width="280" height="15" fill="#4E342E"/>

  <!-- Cat tail (behind body) -->
  <path d="M220,325 Q275,315 265,265" stroke="#FFB74D" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Cat body -->
  <ellipse cx="200" cy="300" rx="26" ry="35" fill="#FFB74D"/>
  <ellipse cx="200" cy="315" rx="14" ry="20" fill="#FFE0B2"/>

  <!-- Cat head -->
  <circle cx="200" cy="240" r="28" fill="#FFB74D"/>

  <!-- Ears -->
  <path d="M175,225 L168,198 L195,218 Z" fill="#FFB74D"/>
  <path d="M176,221 L172,203 L188,217 Z" fill="#FFCCBC"/>
  <path d="M225,225 L232,198 L205,218 Z" fill="#FFB74D"/>
  <path d="M224,221 L228,203 L212,217 Z" fill="#FFCCBC"/>

  <!-- Piano keyboard base -->
  <rect x="40" y="320" width="280" height="40" fill="#3E2723"/>

  <!-- White keys -->
  <rect x="40"  y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="60"  y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="80"  y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="100" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="120" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="140" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="160" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="180" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="200" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="220" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="240" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="260" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="280" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="300" y="320" width="19" height="38" rx="2" fill="#FFFFFF"/>

  <!-- Black keys -->
  <rect x="54"  y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="74"  y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="114" y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="134" y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="154" y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="194" y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="214" y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="254" y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="274" y="320" width="12" height="22" rx="2" fill="#212121"/>
  <rect x="294" y="320" width="12" height="22" rx="2" fill="#212121"/>

  <!-- Arms and paws on keys -->
  <path d="M182,280 Q168,305 178,335" stroke="#FFB74D" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M218,280 Q232,305 222,335" stroke="#FFB74D" stroke-width="14" fill="none" stroke-linecap="round"/>
  <circle cx="178" cy="335" r="8" fill="#FFE0B2"/>
  <circle cx="222" cy="335" r="8" fill="#FFE0B2"/>

  <!-- Face details -->
  <path d="M183,237 Q188,231 193,237" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M207,237 Q212,231 217,237" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M196,250 L204,250 L200,255 Z" fill="#FF8A65"/>
  <path d="M200,255 Q200,260 194,260 M200,255 Q200,260 206,260" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M180,252 L165,250 M180,256 L165,258 M220,252 L235,250 M220,256 L235,258" stroke="#5D4037" stroke-width="1" stroke-linecap="round"/>

  <!-- Head stripes -->
  <path d="M200,222 L200,210 M190,224 L185,212 M210,224 L215,212" stroke="#F57C00" stroke-width="3" stroke-linecap="round"/>

  <!-- Collar -->
  <path d="M185,262 Q200,272 215,262" stroke="#E53935" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="266" r="3" fill="#FFD700"/>

  <!-- Music notes -->
  <g transform="translate(140,190)" fill="#5D4037">
    <circle cx="0" cy="0" r="5"/>
    <rect x="4" y="-28" width="3" height="28"/>
    <path d="M7,-28 Q17,-24 7,-16 Z"/>
  </g>
  <g transform="translate(260,170)" fill="#5D4037">
    <circle cx="0" cy="0" r="5"/>
    <rect x="4" y="-28" width="3" height="28"/>
    <path d="M7,-28 Q17,-24 7,-16 Z"/>
  </g>
  <g transform="translate(200,130)" fill="#5D4037">
    <circle cx="0" cy="0" r="5"/>
    <rect x="4" y="-28" width="3" height="28"/>
    <circle cx="16" cy="-4" r="5"/>
    <rect x="20" y="-32" width="3" height="28"/>
    <path d="M4,-28 L20,-32 L20,-22 L4,-18 Z"/>
  </g>
</svg>
