<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pianoBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="50%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="whiteKey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dddddd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fdf6e3"/>

  <!-- Floating music notes -->
  <g fill="#4a4a4a" opacity="0.5">
    <g transform="translate(200,200) rotate(-10)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-20)"/>
      <rect x="7" y="-35" width="3" height="35"/>
    </g>
    <g transform="translate(600,150) rotate(15)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-20)"/>
      <rect x="7" y="-35" width="3" height="35"/>
    </g>
    <g transform="translate(700,300) rotate(5)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-20)"/>
      <rect x="7" y="-35" width="3" height="35"/>
    </g>
    <g transform="translate(120,350) rotate(-20)">
      <ellipse cx="0" cy="0" rx="10" ry="7" transform="rotate(-20)"/>
      <rect x="7" y="-35" width="3" height="35"/>
    </g>
  </g>

  <!-- Piano -->
  <g id="piano">
    <rect x="140" y="240" width="520" height="40" rx="4" fill="#0d0d0d"/>
    <rect x="150" y="280" width="500" height="240" rx="8" fill="url(#pianoBody)"/>
    <rect x="150" y="360" width="500" height="60" fill="#1f1f1f"/>
    <text x="400" y="395" font-family="Georgia, serif" font-size="20" fill="#d4af37" text-anchor="middle" letter-spacing="2">MEOWNSTEIN</text>

    <!-- Sheet music -->
    <g transform="translate(560,260) skewX(-15)">
      <rect x="0" y="0" width="180" height="60" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
      <line x1="15" y1="18" x2="165" y2="18" stroke="#999" stroke-width="1"/>
      <line x1="15" y1="28" x2="165" y2="28" stroke="#999" stroke-width="1"/>
      <line x1="15" y1="38" x2="165" y2="38" stroke="#999" stroke-width="1"/>
      <line x1="15" y1="48" x2="165" y2="48" stroke="#999" stroke-width="1"/>
      <circle cx="45" cy="38" r="4" fill="#333"/>
      <circle cx="80" cy="28" r="4" fill="#333"/>
      <circle cx="115" cy="38" r="4" fill="#333"/>
    </g>
  </g>

  <!-- Cat (drawn behind the keyboard) -->
  <g id="cat-body">
    <!-- Tail -->
    <path d="M430,460 Q540,440 520,340 Q510,280 440,270" fill="none" stroke="#e67e22" stroke-width="18" stroke-linecap="round"/>
    <path d="M470,430 L490,440" stroke="#d35400" stroke-width="5" stroke-linecap="round"/>
    <path d="M500,370 L520,380" stroke="#d35400" stroke-width="5" stroke-linecap="round"/>

    <!-- Body -->
    <path d="M340,360 Q400,340 460,360 L470,500 Q400,520 330,500 Z" fill="#e67e22"/>
    <ellipse cx="400" cy="430" rx="45" ry="50" fill="#fff5ee"/>

    <!-- Head -->
    <ellipse cx="400" cy="330" rx="65" ry="58" fill="#e67e22"/>
    <path d="M345,295 L365,235 L405,280 Z" fill="#e67e22"/>
    <path d="M455,295 L435,235 L395,280 Z" fill="#e67e22"/>
    <path d="M355,288 L368,250 L392,278 Z" fill="#ffb6c1"/>
    <path d="M445,288 L432,250 L408,278 Z" fill="#ffb6c1"/>

    <!-- Face -->
    <path d="M370,330 Q380,340 390,330" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <path d="M410,330 Q420,340 430,330" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="400" cy="360" rx="25" ry="18" fill="#fff5ee"/>
    <path d="M393,355 L407,355 L400,363 Z" fill="#ff69b4"/>
    <path d="M400,363 Q400,373 390,373" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <path d="M400,363 Q400,373 410,373" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <line x1="360" y1="355" x2="330" y2="350" stroke="#666" stroke-width="1.5"/>
    <line x1="360" y1="360" x2="330" y2="360" stroke="#666" stroke-width="1.5"/>
    <line x1="440" y1="355" x2="470" y2="350" stroke="#666" stroke-width="1.5"/>
    <line x1="440" y1="360" x2="470" y2="360" stroke="#666" stroke-width="1.5"/>
    <path d="M385,285 L385,300" stroke="#d35400" stroke-width="4" stroke-linecap="round"/>
    <path d="M400,280 L400,298" stroke="#d35400" stroke-width="4" stroke-linecap="round"/>
    <path d="M415,285 L415,300" stroke="#d35400" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Keyboard -->
  <g id="keyboard">
    <g fill="url(#whiteKey)" stroke="#bbb" stroke-width="1">
      <rect x="180.0" y="420" width="31.4" height="60" rx="2"/>
      <rect x="211.4" y="420" width="31.4" height="60" rx="2"/>
      <rect x="242.9" y="420" width="31.4" height="60" rx="2"/>
      <rect x="274.3" y="420" width="31.4" height="60" rx="2"/>
      <rect x="305.7" y="420" width="31.4" height="60" rx="2"/>
      <rect x="337.1" y="420" width="31.4" height="60" rx="2"/>
      <rect x="368.6" y="420" width="31.4" height="60" rx="2"/>
      <rect x="400.0" y="420" width="31.4" height="60" rx="2"/>
      <rect x="431.4" y="420" width="31.4" height="60" rx="2"/>
      <rect x="462.9" y="420" width="31.4" height="60" rx="2"/>
      <rect x="494.3" y="420" width="31.4" height="60" rx="2"/>
      <rect x="525.7" y="420" width="31.4" height="60" rx="2"/>
      <rect x="557.1" y="420" width="31.4" height="60" rx="2"/>
      <rect x="588.6" y="420" width="31.4" height="60" rx="2"/>
    </g>
    <g fill="#111">
      <rect x="202" y="420" width="18" height="38" rx="2"/>
      <rect x="234" y="420" width="18" height="38" rx="2"/>
      <rect x="297" y="420" width="18" height="38" rx="2"/>
      <rect x="328" y="420" width="18" height="38" rx="2"/>
      <rect x="360" y="420" width="18" height="38" rx="2"/>
      <rect x="422" y="420" width="18" height="38" rx="2"/>
      <rect x="454" y="420" width="18" height="38" rx="2"/>
      <rect x="517" y="420" width="18" height="38" rx="2"/>
      <rect x="548" y="420" width="18" height="38" rx="2"/>
      <rect x="580" y="420" width="18" height="38" rx="2"/>
    </g>
    <rect x="150" y="480" width="500" height="12" fill="#1a1a1a"/>
  </g>

  <!-- Cat paws on the keys -->
  <g id="paws">
    <ellipse cx="350" cy="465" rx="22" ry="14" fill="#e67e22"/>
    <ellipse cx="450" cy="465" rx="22" ry="14" fill="#e67e22"/>
    <line x1="342" y1="460" x2="342" y2="470" stroke="#d35400" stroke-width="2"/>
    <line x1="350" y1="460" x2="350" y2="470" stroke="#d35400" stroke-width="2"/>
    <line x1="358" y1="460" x2="358" y2="470" stroke="#d35400" stroke-width="2"/>
    <line x1="442" y1="460" x2="442" y2="470" stroke="#d35400" stroke-width="2"/>
    <line x1="450" y1="460" x2="450" y2="470" stroke="#d35400" stroke-width="2"/>
    <line x1="458" y1="460" x2="458" y2="470" stroke="#d35400" stroke-width="2"/>
  </g>

  <!-- Piano bench -->
  <rect x="280" y="495" width="240" height="15" rx="5" fill="#5d4037"/>
  <rect x="320" y="510" width="20" height="60" fill="#5d4037"/>
  <rect x="460" y="510" width="20" height="60" fill="#5d4037"/>
</svg>
