<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Plays Piano — LLM SVG Gallery</title>
    <style>
      body {
        margin: 0;
        background: #fdf6e3;
        color: #6c5b7b;
        font-family: system-ui, sans-serif;
      }
      header {
        text-align: center;
        padding: 32px 16px 8px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.6rem;
      }
      header p {
        margin: 0;
        font-size: 0.9rem;
        opacity: 0.75;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 16px 48px;
      }
      section h2 {
        margin: 32px 4px 12px;
        font-size: 1.15rem;
        border-bottom: 2px solid #f2a65a55;
        padding-bottom: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(108, 91, 123, 0.12);
        margin: 0;
      }
      .card img {
        display: block;
        width: 100%;
        height: auto;
      }
      .meta {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        font-size: 0.85rem;
      }
      .badge {
        background: #f2a65a33;
        color: #b06a1e;
        border-radius: 999px;
        padding: 2px 10px;
      }
      .date {
        opacity: 0.65;
        margin-left: auto;
      }
      #status {
        text-align: center;
        padding: 40px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🐱 Cat Plays Piano 🎹</h1>
      <p>
        同一个 prompt，不同 LLM 的 SVG 产出 · “Generate an SVG of a cat playing
        a piano.”
      </p>
    </header>
    <main id="gallery"><div id="status">loading…</div></main>
    <script>
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };

      fetch("entries.json")
        .then((r) => r.json())
        .then((entries) => {
          const g = document.getElementById("gallery");
          g.replaceChildren();
          if (!entries.length) {
            const empty = el("div", "", "暂无条目");
            empty.id = "status";
            g.append(empty);
            return;
          }
          const groups = {};
          for (const e of entries) (groups[e.model] ??= []).push(e);
          for (const model of Object.keys(groups).sort()) {
            const sec = el("section");
            sec.append(el("h2", "", model));
            const grid = el("div", "grid");
            for (const e of groups[model]) {
              const card = el("figure", "card");
              const img = el("img");
              img.src = e.file;
              img.alt = `${model} 的猫弹钢琴 SVG`;
              img.loading = "lazy";
              const meta = el("figcaption", "meta");
              if (e.thinking)
                meta.append(el("span", "badge", `thinking: ${e.thinking}`));
              meta.append(el("span", "date", e.date));
              card.append(img, meta);
              grid.append(card);
            }
            sec.append(grid);
            g.append(sec);
          }
        })
        .catch(() => {
          document.getElementById("status").textContent =
            "entries.json 加载失败";
        });
    </script>
  </body>
</html>
